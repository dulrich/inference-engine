# Residency: one `matrix` (replaced the nine `groups:` 2026-10-19, plans/serving-control-redesign.md
# WP-5; semantics measured in docs/serving-control-spikes-2026-10.md, rule in llama/AGENTS.md).
# Each `sets:` entry names models allowed to be resident together (`&`); loading a model moves
# residency to a permitted set containing it and stops every model outside that set. Invariant:
# NO permitted set exceeds the ~12.8 GiB realistic free-VRAM budget (desktop-shared host, fit
# math below). Retrieval models coexist with each other and with one small live chat model; chat
# models never coexist with each other; the 27B, the MoE-offload models and every research-only
# alias are solo sets (the quiet-GPU eviction the bake-off relies on). A model with no measured
# fit beside retrieval is solo (fail safe). Every model key appears in at least one set. ttl
# still unloads every model individually. Footprints: retrieval trio ≈1.5 GiB; nemotron-4b
# ≈5.5 GB; gemma-4-12b-qat ≈11.5 GB (10.7 GiB); MiniCPM5-2B ≤3536 MiB; the 27B 13.72 GiB.
#
# ── Measurement history (carried over from the former groups' comments) ──
#
# ── Former `chat` group history ── Under the old `groups:` layout a chat request evicted the
# retrieval models (exclusive: true). The eviction-and-restore cycle was tested at cutover
# (2026-07-26, gemma-4-12B Q4_K_M as the chat member, RX 9070/RADV): two full evict→reload
# cycles, embeddings byte-identical after each reload, ~1.3s retrieval reloads warm, no amdgpu
# errors in the kernel log. Under the matrix a small chat model sits beside retrieval instead.
#
# ── VRAM fit math (host-verified 2026-07-26, no container/model touched to get these numbers) ──
#
# GPU VRAM: `cat /sys/class/drm/card1/device/mem_info_vram_total` = 17,095,983,104 bytes
# = 15.92 GiB / 17.10 GB (RX 9070, matches its 16G nameplate). This is a machine with an active
# interactive desktop session on the SAME gpu, not a headless inference box: at measurement
# time `mem_info_vram_used` = 3,327,463,424 bytes (~3.1 GiB / 3.3 GB), and `fuser /dev/dri/*`
# showed ghostty, firefox, LM Studio, obsidian, and nvtop all holding the render node. So real
# free VRAM at request time is ~12.8 GiB / 13.8 GB, not the full nameplate figure — and
# matrix eviction only stops THIS router's own children; it cannot and does not free VRAM held
# by other GPU clients on the host. The math below uses both figures: nameplate total (an upper
# bound assuming nothing else is using the GPU) and the measured free-now figure (the realistic
# bound on this desktop-shared host).
#
# Per-model weights are exact file sizes (`stat -c %s`) on the candidate GGUFs already on disk
# (paths below mapped at measurement time to `~/.lmstudio/models/<publisher>/<repo>/…`; the
# GGUF-home move has since completed, and the host layout is now
# `/srv/models/<publisher>/<repo>/…`). KV cache is computed from each GGUF's own
# header metadata (block count, per-layer attention.head_count_kv,
# attention.key_length/value_length, attention.sliding_window — read directly, no model
# loaded) at f16 KV (llama.cpp's default cache type, unquantized) and is SWA-aware: gemma4
# declares a per-layer sliding_window (1024
# tokens) and llama.cpp allocates the reduced cache size for the majority of layers that use it,
# not the full requested context — only the minority "global" layers (the ones with a markedly
# smaller head_count_kv in the GGUF metadata) scale with the full context size.
#
# - gemma-4-12B-it-Q4_K_M (IN, cutover-tested): weights 7,381,384,864 B = 6.87 GiB / 7.38 GB.
#   48 layers (40 local @ head_count_kv=8 capped at the 1024-token sliding window, 8 global @
#   head_count_kv=1 scaling with context), key/value head dim 512. At the configured -c 32768,
#   SWA-aware KV ≈ 1.12 GiB / 1.21 GB → weights+KV ≈ 8.0 GiB / 8.6 GB. Comfortably under BOTH
#   the nameplate total and the measured ~12.8 GiB free-now, leaving ~4.8 GiB for the
#   compute/graph buffer even on this desktop-shared host.
# - NVIDIA-Nemotron-3-Nano-4B-UD-Q4_K_XL (IN, small/fast option; weights upgraded 2026-08-25
#   from lmstudio Q4_K_M — see the registry note, plans/long-context-serving-default.md WP-2):
#   weights 3,133,118,624 B = 2.92 GiB / 3.13 GB. `nemotron_h` is a hybrid Mamba/attention
#   architecture — only 4 of its 42 layers are real attention (head_count_kv=8, head dim 128,
#   blocks 12/17/24/32); the other 38 are SSM/conv state layers whose per-token state is
#   ~constant in sequence length, not a KV cache in the usual sense, and this arch carries no
#   sliding_window metadata. KV ≈ 16 KiB/token (4 layers × 8 heads × 256 dims × f16).
#   Live-measured 2026-08-25 at the landed -c 131072: total footprint ≈5.5 GB used
#   (weights+KV+buffers), >9 GB free — needle-at-depth recall exact at a real 117,982-token
#   prompt (90% fill), prefill 2,353 t/s. 256k VALID: at -c 262144 footprint ≈7.9 GB,
#   >7 GB free, recall exact at a real 234,542-token prompt (89.5%), prefill 1,649 t/s —
#   262144 is a valid config for this alias; 131072 is the serving default per plan. The GGUF
#   header claims context_length=1048576 (both lmstudio and unsloth conversions); the NVIDIA
#   base config says max_position_embeddings=262144 — targets clamped to the smaller. Note:
#   this model routinely returns its answer in `reasoning_content` with empty `content` on
#   terse factual asks — count both channels before calling a response empty.
# - gemma-4-26B-A4B-it-QAT-Q4_0 (OUT — for now): weights 14,439,362,752 B = 13.45 GiB /
#   14.44 GB. That number ALONE already exceeds the measured ~12.8 GiB free-now on this
#   desktop-shared host, before any KV cache or compute/graph buffer is added. Even against the
#   full 15.92 GiB nameplate total (i.e. only if every other GPU client on the host were closed
#   first), weights + SWA-aware KV at a modest -c 8192 land around 14.0 GiB, leaving well under
#   2 GiB for the compute buffer — too thin a margin to add blind. Revisit if this box becomes
#   dedicated/headless (removing the ~3.3 GB desktop baseline), or under a more aggressive quant
#   (Q2_K/Q3) that shrinks the weights figure materially.
# - 27B (Qwen3.6-27B-Q4_K_M, 16,547,398,784 B = 15.41 GiB/16.55 GB), 31B
#   (gemma-4-31B-it-QAT-Q4_0, 17,651,000,768 B = 16.44 GiB/17.65 GB), 35B-A3B
#   (Qwen3.6-35B-A3B-Q4_K_M, 21,166,757,728 B = 19.71 GiB/21.17 GB) — all OUT, per the plan's
#   expectation, but on measured weight sizes rather than an assumed 16G ceiling: 27B's weights
#   alone leave only 0.5 GiB against the full 15.92 GiB nameplate before any KV/compute buffer;
#   31B's and 35B-A3B's weights alone already exceed the card's total nameplate capacity, i.e.
#   they cannot load fully-offloaded on this GPU regardless of context size or what else is
#   running.
# ── Ling-3.0-tiny (former `ling-bakeoff` group) — quant bake-off, testing only, canary-first
# (see plans/ling-3-tiny-bakeoff-and-gpu-hang-watchdog.md). Each quant is a solo matrix set: no
# quant needs to coexist with anything during testing, and solo is also a safety property —
# only one untrusted-on-this-host-architecture process resident at a time. Each model entry
# above carries its own `ttl: 1800`.
#
# ── VRAM fit math (host-verified 2026-08-20, live single- + multi-turn canary probes, two of
# the four bake-off quants — the other two land in WP-3) ──
#
# Not extrapolated from the `chat` group's dense-model math above — deliberately measured live
# instead, since this architecture's 6-of-24-layers-have-KV-cache shape (the other 18 are
# KDA/linear-attention, no conventional KV cache, no sliding_window metadata) makes a static
# extrapolation unreliable. `mem_info_vram_used` read directly before/after each load, at
# -c 8192, after both a single-turn and a ≥3-turn (5-message) exchange per model, watched
# against `journalctl -k -f` throughout with zero MES/wedged/reset signature.
#
# Baseline (nothing from this group loaded, desktop session active): 1,204,256,768 B
# = 1.12 GiB / 1.20 GB. (Lower than the `chat` group's older 2026-07-26 desktop-baseline
# measurement of ~3.1 GiB — a snapshot of whatever else happened to be holding the render node
# that day, not a fixed floor; re-measure at request time rather than assuming either figure.)
#
# - Ling-3.0-tiny-Q4_K_M: weights 4,823,894,880 B = 4.49 GiB / 4.82 GB. Peak `mem_info_vram_used`
#   after load + single-turn + multi-turn: 6,148,374,528 B = 5.73 GiB / 6.15 GB → weights+KV+
#   buffer delta from baseline ≈ 4.60 GiB / 4.94 GB, i.e. only ~0.11 GiB of KV+compute-buffer
#   overhead beyond the weights alone — small, consistent with only 6/24 layers carrying a real
#   KV cache and the conservative `-c 8192`. Comfortably under the 15.92 GiB nameplate total.
# - Ling-3.0-tiny-UD-Q4_K_XL: weights 5,340,611,328 B = 4.97 GiB / 5.34 GB. Peak
#   `mem_info_vram_used` after load + single-turn + multi-turn (measured after `exclusive: true`
#   fully evicted Q4_K_M first): 6,602,141,696 B = 6.15 GiB / 6.60 GB → weights+KV+buffer delta
#   from baseline ≈ 5.03 GiB / 5.40 GB, ~0.05 GiB overhead beyond weights alone. Also
#   comfortably under the nameplate total.
#
# - Ling-3.0-tiny-UD-Q6_K_XL: weights 7,274,546,528 B = 6.77 GiB / 7.27 GB. Peak
#   `mem_info_vram_used` after load + single-turn + multi-turn (baseline re-measured at
#   1,295,380,480 B / 1.21 GiB just before this load — a few hundred MB higher than the Q4
#   pair's baseline above, ordinary desktop-VRAM fluctuation, not a fixed floor):
#   8,540,147,712 B = 7.95 GiB / 8.54 GB → delta from baseline ≈ 6.75 GiB / 7.24 GB, i.e.
#   essentially weights-alone (the ~0.03 GiB "negative overhead" against the raw weights figure
#   is baseline-measurement noise, not a real effect — two `mem_info_vram_used` reads taken
#   minutes apart on a shared desktop session routinely differ by a few hundred MB). Comfortably
#   under the 15.92 GiB nameplate total.
# - Ling-3.0-tiny-Q8_0: weights 8,408,187,968 B = 7.83 GiB / 8.41 GB — the largest single file
#   in this group. Note: its first single-turn probe (`max_tokens: 128`) hit `finish_reason:
#   "length"` with EMPTY `content` — this model's reasoning trace is more verbose than
#   Q4_K_M/UD-Q4_K_XL/UD-Q6_K_XL's, similar in shape to gemma-4's own `max_tokens >= 128`
#   requirement (see the `chat` group's macro comment) but needing more headroom still;
#   `max_tokens: 512` got a real answer. Not a hang, not a config defect — a bake-off/testing
#   finding worth carrying into whatever `max_tokens` the eventual bake-off evaluation uses; no
#   change made here since this group's `cmd` doesn't set `max_tokens` (that's a per-request
#   field, not a server flag). Peak `mem_info_vram_used` after load + both probes:
#   9,657,081,856 B = 8.99 GiB / 9.66 GB → delta from baseline ≈ 7.79 GiB / 8.36 GB, again
#   essentially weights-alone within the same measurement-noise band as UD-Q6_K_XL above.
#   Comfortably under the 15.92 GiB nameplate total — even this largest quant leaves several
#   GiB of headroom on this card.
#
# All four bake-off quants now load individually within nameplate VRAM with no compute-buffer
# surprises; none were tested loaded simultaneously (each quant is a solo set by design —
# see above — so that was never the point).
#
# ── Context ceiling raised to 131072 (host-verified 2026-08-21, see
# plans/ling-3-tiny-context-ceiling.md) ──
#
# `-c 8192` above was deliberately conservative pending a live measurement of this hybrid
# KDA/MLA architecture's per-token KV cost; that measurement is now in. GGUF-header geometry
# (all four quants, byte-identical across quants): `block_count=24`,
# `attention.head_count_kv` nonzero at exactly 6 of 24 positions (the MLA layers) with
# `attention.key_length=576` = `attention.kv_lora_rank(512) + rope.dimension_count(64)` — a
# single compressed latent cached once per token per real-KV layer, not per-attention-head
# (`attention.head_count=16`), which is the mechanism (not a guess) behind MLA's cache being far
# smaller than a dense model's at the same head count/context. Assuming f16 storage of that
# 576-element latent on both the K and V side across the 6 real-KV layers predicts ≈13.5
# KB/token of KV overhead — matches the already-measured Q4_K_M `-c 8192` delta above (≈0.11
# GiB) almost exactly, and extrapolated linearly to 131072 tokens predicts only ≈1.7-1.8 GiB of
# KV overhead even at max context, against the ~12.8 GiB realistic free-VRAM budget below.
#
# Live needle-in-haystack probes (moderate ~32768 and near-ceiling ~110-120K prompt tokens,
# correct recall required, `journalctl -k -f` watched throughout, zero MES/wedged/reset
# signature) at `-c 131072`:
#
# - Ling-3.0-tiny-Q4_K_M (canary, WP-1 Part A, f16 cache): baseline 1,739,743,232 B (1.62 GiB).
#   Single-turn ping: 7,624,044,544 B (7.10 GiB). Moderate probe (29,463 real prompt tokens,
#   correct recall): 7,698,051,072 B (7.17 GiB). Near-ceiling probe (111,272 real prompt tokens,
#   correct recall, 62.2s wall): PEAK 8,013,406,208 B (7.46 GiB) → 1.35 GiB overhead beyond the
#   4.49 GiB weights (KV + compute buffer combined, at the full -c 131072 pre-allocation) —
#   under the ≈1.7-1.8 GiB a-priori estimate above. Real measured KV growth rate between the two
#   probes ≈3.85 KB/token (vs the ≈13.5 KB/token worst-case estimate — the gap is explained
#   below). Zero journal signature either probe. Comfortably under nameplate.
# - KV cache type test (WP-1 Part B): a hard-gated symmetric q8_0/q8_0 + `-fa on` compatibility
#   test was run on the canary given two upstream risk signals for this architecture+backend
#   combination (BailingMoE3's own merge PR reported "freezes on Vulkan"; the closely-related
#   DeepSeek MLA family has an open llama.cpp issue where quantized K-cache produces "confident
#   gibberish" while the server stays healthy). **Result: REJECTED, not landed.** A scratch
#   verbose-logged load confirmed flash_attn=enabled and real quantization took effect (K cache
#   14.34 MiB at q8_0 vs 27.00 MiB at f16, same 4096-token context) — and confirmed MLA caches
#   only ONE side (`V (q8_0): 0.00 MiB` — a single shared latent, not separate K/V caches, which
#   is why the real KV rate above is ~3.5x smaller than the dual-sided worst-case estimate).
#   The moderate probe (29,463 tokens) recalled correctly, matching the f16 baseline exactly
#   (GLiNER2 exact-entity-match + bge-m3 cosine similarity 1.0, both trivial since the completion
#   text was byte-identical). But the near-ceiling probe (111,272 tokens, identical prompt to the
#   f16 baseline) FAILED both times it was run: `finish_reason: "length"`, empty `content`, the
#   full 1024-token budget spent on `reasoning_content` that never located the embedded fact —
#   reproduced on a second attempt (10.4s wall, 111,268/111,272 tokens cache-hit, so not a
#   prefill-timing fluke) with the model's own reasoning trace showing it searching the wrong
#   region of the prompt. No hang, no journal signature, container stayed healthy throughout —
#   this is a correctness regression specific to quantized cache at large context, not a Vulkan
#   freeze. Per the plan's Part B decision rule, `ling-3-tiny-q4-m` (and, transitively, all four
#   quants — WP-2 stays f16-only) keep the f16 default; `-ctk`/`-ctv`/`-fa` are NOT added to any
#   entry in this group. Worth a separate, narrower follow-up if throughput ever motivates
#   revisiting this — not attempted again in this plan.
# - Ling-3.0-tiny-UD-Q4_K_XL (WP-2, f16 cache): weights 5,340,611,328 B = 4.97 GiB / 5.34 GB.
#   Near-ceiling probe (111,269 real prompt tokens, correct recall, `finish_reason: "stop"`,
#   62.15s wall): PEAK 8,366,440,448 B = 7.79 GiB / 8.37 GB → ≈1.20 GiB overhead beyond weights
#   (using WP-1's clean empty-group baseline of 1,739,743,232 B / 1.62 GiB — see methodology
#   note below). Zero journal signature. Comfortably under nameplate.
# - Ling-3.0-tiny-UD-Q6_K_XL (WP-2, f16 cache): weights 7,274,546,528 B = 6.77 GiB / 7.27 GB.
#   Near-ceiling probe (111,271 real prompt tokens, correct recall, 61.93s wall): PEAK
#   10,316,177,408 B = 9.61 GiB / 10.32 GB → ≈1.21 GiB overhead beyond weights, in line with
#   UD-Q4_K_XL above. Zero journal signature. Comfortably under nameplate.
# - Ling-3.0-tiny-Q8_0 (WP-2, f16 cache): weights 8,408,187,968 B = 7.83 GiB / 8.41 GB — the
#   largest quant in this group. Single-turn ping needed `max_tokens: 512` (18 completion
#   tokens used; a shorter budget is not enough for this quant's more verbose reasoning trace —
#   same finding as the original -c 8192 bake-off, still true at -c 131072). Near-ceiling probe
#   (111,270 real prompt tokens, correct recall, `finish_reason: "stop"`, 61.09s wall): PEAK
