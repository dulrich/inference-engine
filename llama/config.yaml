# WP-4 step 5 (host-verified 2026-08-21): config B propagated to UD-Q5_K_XL (`-ncmoe 34`) and
# UD-Q6_K_XL (`-ncmoe 35`), each recomputed from that file's own tensor-level GGUF math. Both
