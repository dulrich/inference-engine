# inference-engine-llama — llama-swap router config for the Vulkan GPU llama.cpp image
# (crucible-llamacpp-vulkan:b10534-swap243).
#
# This file is bind-mounted read-only at /app/config.yaml by the compose service — it is NEVER
# baked into the image (the Dockerfile does not COPY it), specifically so it can be edited
# without a rebuild. The compose wiring for that mount lives in fleet-tools's
# compose.fleet.yml; this file only defines the router shape. Config edits apply on container
# restart, not on save.
#
# ── Aliases are the API surface — APPEND ONLY, never rename or delete ──────────────────────────
#
# An alias rename does not error anywhere; it silently forks consumer state. Treat this list the
# way a public API's field names are treated. Add new aliases freely; never repurpose one.
# A MODEL-KEY rename must be mirrored into router/catalog/catalog.json in the same edit (its
# `modelKey`/`exposures` crosswalk the key to the gateway id); an ALIAS rename stays forbidden outright,
# so the `gateway_id` crosswalk can never silently fork. `bun run check:recipes` catches the key
# rename; this line is why.
# KV suffix rule (user, 2026-10-19): every NEW alias appends its KV-cache format as a `-kv<type>`
# suffix (`-kvf16`, `-kvq8`, `-kvq4`, …; f16 included, never implicit). New aliases only —
# existing aliases are never renamed.
#
# ── Consumer registry — who stores which alias, and where ──────────────────────────────────────
#
#   alias             consumer            stored where
#   bge-m3            obsidian-crucible   vault data.json provider modelId (embeddings; the
#                                         index's embedding_space key `bge-m3/f16` derives
#                                         from it — a rename would orphan a 53k-chunk index)
#   bge-reranker-v2   obsidian-crucible   vault data.json provider modelId (rerank)
#   gemma-4-12b       obsidian-crucible   vault data.json provider modelId (chat, vision)
#                     seven-afterlives    --llm-model launch flag + docs/llm-disclosure.md
#                                         backend entry (optional validated backend)
#                     ── TOMBSTONE: REMOVED FROM SERVING 2026-08-25 (user-directed,
#                        plans/mtp-serving-rollout.md WP-2) — an explicit removal decision, NOT a
#                        silent repoint. The consumers above still store `gemma-4-12b` and will
#                        error until the user repoints them to `gemma-4-12b-qat` (now the full
#                        replacement: chat + vision + MTP — see its entry below). The removal
#                        decision is durably recorded at plans/mtp-serving-rollout.md WP-2 above;
#                        the consumer repoint itself is the user's call and is no longer tracked in
#                        INITIATIVE.md (that entry was added at `55cac32` 2026-08-25 and retired by
#                        the user at `cf0220d`). The alias name stays reserved forever — never
#                        reuse it for different backing weights (append-only contract).
#   nemotron-4b       obsidian-crucible   vault data.json provider modelId (chat)
#                     seven-afterlives    same as gemma-4-12b
#                     ── 2026-08-25 weights upgrade (user-directed, same alias,
#                        plans/long-context-serving-default.md WP-2): backing file swapped
#                        lmstudio-community Q4_K_M → unsloth UD-Q4_K_XL (same base model,
#                        same wire behavior — deliberately NOT the gemma-style
#                        remove+new-alias path). Model key renamed to match the quant
#                        (key had no consumer; the alias is what consumers store).
#   qwen38-27b-iq3s   Claude Code         inference-engine router/gateway.config.json,
#   qwen38-27b-iq3s-off                   `claude-local.models[]`. Reasoning effort is chosen
#   qwen38-27b-iq3s-low                   PER REQUEST by the router since patch `0007`
#   qwen38-27b-iq3s-medium                (plans/router-effort-mapping-claude-local.md WP-2):
#   qwen38-27b-iq3s-high                  the harness's own effort control maps through that
#                                         file's `effortKwargs` table onto `chat_template_kwargs`
#                                         on the upstream body — no id rewrite, no model swap.
#                                         (Patch `0009`, 2026-09-14, made `xhigh`/`max` distinct
#                                         levels in that table rather than aliases of `high`.)
#                                         The four suffixed ids stay resolvable as the explicit
#                                         SERVER-ENFORCED HARD-CAP surface (their `cmd:`
#                                         reasoning flags below are the ceiling).
#                                         ── VISIBILITY MOVED 2026-09-14
#                                            (plans/bench-dashboard-serving-control.md WP-3):
#                                            visibility for EVERY served key is now declared in
#                                            router/catalog/catalog.json (since WP-3 of
#                                            plans/serving-control-redesign.md; it replaced
#                                            `serving-visibility-v1`), keyed by MODEL KEY with a
#                                            `gateway_id` crosswalk, NOT in gateway.config.json's
#                                            `consumers` map — which the `claude-local` provider
#                                            no longer carries at all. The four suffixed ids
#                                            carry `consumers: []` there, which still means NO
#                                            PICKER ROW; only the unsuffixed `qwen38-27b-iq3s` is
#                                            a `modelPicker.options` row of
#                                            ~/.claude/settings.json, regenerated by
#                                            router/model-picker-lineup.mjs --write
#                                            --launch-profile. They DO now get an Open WebUI row,
#                                            created and held inactive, because model identity is
#                                            sync-owned under the same decision (see the Open
#                                            WebUI registry row below). A model-key rename must be
#                                            mirrored into router/catalog/catalog.json; an alias rename
#                                            stays forbidden outright.
#                                         Registered 2026-09-12,
#                                         plans/local-leg-claude-code-serving-fit.md WP-2;
#                                         retagged 2026-09-12,
#                                         plans/router-effort-mapping-claude-local.md WP-3. The
#                                         four suffixed aliases are effort variants of the same
#                                         UD-IQ3_S weights, not new models.
#   bge-small         news-ingestion      Postgres `PRIMARY KEY (event_id, model)` in the
#                                         `crisis24_enrich` schema. The wire alias and the
#                                         stored id DIFFER on purpose: `bge-small` on the wire,
#                                         `bge-small-en-v1.5` in the PK (enrich's `model_id`
#                                         property — `_short_id` drops the HF org prefix from
#                                         `BAAI/bge-small-en-v1.5` — and it must keep returning
#                                         the in-process value: 19k rows carry it). Its embedding space is
#                                         engine-agnostic by fleet measurement (esi-fr-2026-07-25:
#                                         engine/build/precision are retrieval-irrelevant), which
#                                         is what makes serving these vectors from llama.cpp
#                                         instead of sentence-transformers safe — enrich has no
#                                         embedding-space guard of its own.
#   gemma-4-26b-a4b   (none yet)          NO CONSUMER YET — added 2026-09-13
#                                         (plans/gemma4-26b-a4b-qat-mtp-ladder.md WP-4), the
#                                         served 128k rung of the QAT+MTP context ladder. Listed
#                                         here from landing so the append-only contract covers it
#                                         before anything stores it; this row gains a consumer the
#                                         day one actually does.
#   minicpm5-2b-q6k-c32k-kvf16  (none yet)  NO EXTERNAL CONSUMER — added 2026-10-19
#   minicpm5-2b-q6k-c64k-kvq8               (plans/minicpm5-2b-q6k-serving.md); Open WebUI only,
#   minicpm5-2b-q6k-c128k-kvq4              which keys rows by model key (row below).
#   (model keys)      Open WebUI          per-model settings (capability toggles, description)
#                                         in Open WebUI's own config DB, keyed by `/v1/models`
#                                         `id` — which llama-swap sets to the model KEY, not the
#                                         alias (aliases ride in `meta.llamaswap.aliases`).
#                                         Synced by the capability-sync script
#                                         (plans/capability-surfacing-and-local-agent-endpoints.md
#                                         WP-3). A key rename orphans that model's Open WebUI
#                                         settings until the next sync — keys are therefore
#                                         rename-sensitive for this consumer, though re-syncable
#                                         (unlike the stored-alias consumers above, whose state
#                                         is NOT regenerable). Capability field contract:
#                                         docs/model-capabilities.md.
#                                         ── 2026-09-14 (user decision,
#                                            plans/bench-dashboard-serving-control.md WP-3): the
#                                            sync now also OWNS `is_active` for every served key,
#                                            driven by router/catalog/catalog.json — desired-true iff
#                                            `openwebui` is in that key's declared `consumers`.
#                                            Every served key gets a row (created if absent); the
#                                            router-only and embed/rerank keys get one held
#                                            INACTIVE rather than no row at all. Every other Open
#                                            WebUI setting stays admin-owned, and the script still
#                                            never deletes — hiding is deactivation.
#                                         ── 2026-09-14 (plans/owui-effort-rows-and-arming.md):
#                                            the sync also owns DERIVED effort rows, one Open WebUI
#                                            row per reasoning level with the stored id
#                                            `<model key>--effort-<none|low|medium|xhigh>`
#                                            (`base_model_id` = the model key, `params.
#                                            reasoning_effort` = the level). The id family is a
#                                            stored identifier in Open WebUI's DB — append-only
#                                            under this contract from the first row landed
#                                            (`Qwen3.8-27B-UD-IQ3_S--effort-low`, WP-1). Levels come
#                                            from router/gateway.config.json `effortKwargs` (+ none);
#                                            a key with no entry gets no derived rows.
#
# The onnx tier next door keeps its own registry with the same rules and the same header:
# `onnx/models.yaml` (aliases `gliner2-base`, `gliner2-pii`).
#
# ── Bake-off / testing aliases (no external consumer yet) ──────────────────────────────────────
#
# `ling-3-tiny-ud-q4-xl`, `ling-3-tiny-ud-q6-xl`, `ling-3-tiny-q8` (the `ling-bakeoff` group
# below) — quants of Ling-3.0-tiny (bloomer010/Ling-3.0-tiny-GGUF, BailingMoE3 architecture)
# added for an internal bake-off, not yet adopted by any consumer. Originally four quants;
# `ling-3-tiny-q4-m` (Q4_K_M) was removed from serving 2026-08-25 (user-directed,
# plans/mtp-serving-rollout.md WP-2: serve only the dynamic 4-bit/6-bit + the Q8_0 reference). Not
# a full registry row above because there is nothing to protect yet — these are still subject to
# rename/removal without the append-only consumer-registry guarantee until a consumer actually
# adopts one. Move whichever quant wins the bake-off into the table above (with its own row) if
# and when a consumer starts storing its alias. See
# `plans/ling-3-tiny-bakeoff-and-gpu-hang-watchdog.md` for how these were validated (llama.cpp
# version-gated to a BailingMoE3-capable build, canary-first live load order, per-alias
# save-work-gated probing) — the plan covers getting these four aliases downloaded, configured,
# and reachable; it does not cover running or judging the bake-off itself.
#
# `gemma-4-12b-qat` (the `gemma-qat-bakeoff` group below) — unsloth/gemma-4-12B-it-qat-GGUF's
# only published quant (UD-Q4_K_XL, QAT = quantization-aware-trained weights), added
# plans/serving-harness-round-2.md WP-2 as a new no-consumer-yet testing alias, deliberately NOT
# a repoint of the live `gemma-4-12b` alias above (append-only contract; a same-alias
# backing-weights swap would be a silent, consumer-facing behavior change — see that plan's
# Decisions locked). Upgraded 2026-08-25 (plans/mtp-serving-rollout.md WP-2, after the
# user-directed removal of `gemma-4-12b`): now the full replacement — `--mmproj` (vision, the
# repo's own mmproj-BF16) and `-md` + `--spec-type draft-mtp` (the repo's 0.24 GiB MTP sidecar,
# lossless target-verified speculative decode measured +66% tg on this card at temp 0). Still
# awaiting the user-side consumer repoint recorded in the `gemma-4-12b` tombstone above.
#
# `qwen36-a3b` (the `qwen36-a3b-bakeoff` group below) — unsloth/Qwen3.6-35B-A3B-GGUF (`qwen35moe`
# architecture: a hybrid of attention + SSM/recurrent layers, 256 fine-grained routed experts +
# 1 shared expert, 8 active per token), added plans/serving-harness-round-2.md WP-4. MoE
# expert-offload placement search (configs A/B/C: `-ncmoe` layer count on the same maximal
# `-ngl 99`) landed config B (`-ncmoe 32`, 8 of 40 layers' routed experts GPU-resident) as the
# winner — config A (`-ncmoe 24`) left an unsafe VRAM margin at moderate/long context; config C
# (`-cmoe`, all experts CPU-resident) had superior VRAM/RAM headroom but FAILED near-ceiling
# (~55K token) needle recall reproducibly on two independent probes (degenerate haystack-token
# regurgitation instead of reasoning, not merely a truncated-but-on-track reasoning trace) — see
# the group's own fit-math comment below for the full placement-search record. `-c 100000`: the
# live-verified "useful long-context target" test point from the plan's own scope, not this
# model's real ceiling (GGUF header reports `qwen35moe.context_length=262144`) — not pushed
# further this WP, matching "push further only if cheap and justified."
# Recipe change 2026-08-25 (plans/mtp-serving-rollout.md WP-2): `qwen36-a3b` repointed to the
# unsloth Qwen3.6-35B-A3B-MTP-GGUF variant (same UD quant recipe + embedded `blk.40.nextn.*` MTP
# heads) with `--spec-type draft-mtp` — measured +64% tg (29.0 → 47.6 t/s at `-ncmoe 32`),
# lossless/target-verified; bake-off records from before this date measured the plain non-MTP
# file. `qwen36-a3b-q5` / `qwen36-a3b-q6` (UD-Q5_K_XL / UD-Q6_K_XL, config B propagated per WP-4
# step 5: `-ncmoe 34`/`-ncmoe 35`) were REMOVED from serving the same date (user-directed: hold
# on Q4 only; their MTP-variant downloads were cancelled) — testing-only aliases, no consumer;
# re-adding them later is a download + config re-add on ask.
# Recipe change 2026-09-08 (plans/moe-offload-load-mode-and-qwen4exp-fit-math.md WP-1): qwen36-a3b
# adds --load-mode none (+80% prefill measured, decode flat); -ub 512 dropped from the chat macro
# (default, was double-specified).
#
# `qwen38-27b-iq3xxs` / `qwen38-27b-iq3s` / `qwen38-27b-q3kxl` (the `qwen38-27b-bakeoff` group
# below) — unsloth/Qwen3.8-27B-GGUF (`qwen35` architecture: a DENSE sibling of Qwen3.6-35B-A3B's
# `qwen35moe`, same hybrid attention+SSM/recurrent layer mix, `full_attention_interval=4`),
# added plans/serving-harness-round-2.md WP-5. Full `-ngl 99` (no MoE, no `-ncmoe`). VRAM is the
# binding constraint on this 16 GiB card, not RAM: the `-c 100000` target from this plan's own
# scope proved unsafe (0.10 GiB free) for even the smallest weights (canary UD-IQ3_S) — live
# fit-testing (scratch port, exact linear KV-growth rate measured directly) found real safe
# ceilings well below that target with f16 KV cache: `-c 40960` for UD-IQ3_XXS (2.76 GiB free),
# `-c 24576` for UD-Q3_K_XL (1.83 GiB free, the largest quant needing the most headroom back).
# See the group's own fit-math comment below for the full f16-cache record, including a genuine
# accumulated-page-cache confound this WP found and fixed (`POST /api/models/unload` + a
# `--force-recreate` for a truly fresh cgroup — see that comment for when each applies).
# UD-IQ3_S alone was later revisited by plans/qwen38-27b-kv-cache-quantization.md WP-2/3
# (2026-08-21/22): its `-c 40960`-f16 entry from this WP was superseded by a live-verified
# q4_0/q4_0 KV-cache-quantization win reaching `-c 120000` at near-parity throughput — see that
# model's own entry below for the ladder and the decision record; UD-IQ3_XXS/UD-Q3_K_XL were not
# re-tested (out of that plan's scope) and remain on this WP's original f16-cache config.
#
# One base-URL note: consumers reach this router at http://127.0.0.1:4811 (Crucible vaults
# store http://127.0.0.1:4811/v1). The transitional 4806 host publish was retired 2026-07-27;
# :4806 survives only as the container-internal listen port.
#
# One always-on router replaces the old per-model systemd socket-activation apparatus entirely:
# llama-swap already does spawn-on-first-request plus `ttl`-based unload, so there's no separate
# idle/wake layer to maintain, and the idle cost is a few MB of resident Go process, not a
# full inference server.

healthCheckTimeout: 120  # seconds llama-swap waits for a freshly spawned child's checkEndpoint
                         # to go healthy before giving up on the request that triggered the spawn
startPort: 15800         # first ${PORT} handed to a spawned child; never published outside the
                         # container — only llama-swap's own :4806 listener is reachable.
                         # 15800, not 5800: the old value collided (cosmetically — it was
                         # container-internal) with the fleet's 57X0/5800 dev-port convention,
                         # and a new repo should not inherit that coincidence.

macros:
  # The flags below are carried over verbatim from the compose invocations this service
  # replaces (crucible-embed-gpu / crucible-rerank-gpu). `--pooling` is DELIBERATELY absent from
  # every model's cmd: the GGUF metadata already carries the correct pooling mode, and
  # `--embeddings` / `--reranking` each imply their own pooling on top of that — do not add
  # `--pooling` back in "to be explicit". `-ngl 99` offloads every layer to the GPU. `-c 8192
  # -b 8192` keep bge-m3's full context and logical batch, but `-ub` is 4096, not 8192
  # (2026-10-14, fleet-tools plans/fleet-memory-crush.md WP-1): at `-ub 8192` one long input
  # grows a compute buffer past the Vulkan device max buffer size, ggml_vulkan logs `Failed to
  # allocate pinned memory`, and the buffer falls back to HOST RAM — measured 143 MiB → 6.96 GiB
  # anonymous for bge-m3 after a single ~2.6k-token request; at `-ub 4096` the same load holds
  # 184 MiB (cliff between 4096 and 6144; bulk embedding ~17% slower). Contract: a single embedding
  # input, or a rerank query+document pair, must fit one ubatch, so it is capped at 4096 tokens — a
  # longer input gets an error instead of the old success. Do not raise `-ub` back without
  # re-measuring host anonymous memory (`/proc/<pid>/smaps_rollup` Pss_Anon).
  llama_server_common: >
    /usr/local/bin/llama-server
    --host 0.0.0.0 --port ${PORT}
    -ngl 99 -c 8192 -b 8192 -ub 4096

  # Chat models get their OWN macro, deliberately not `llama_server_common` — do not "simplify"
  # by reusing it. The retrieval macro's `-b 8192` / `-ub 4096` was tuned for batch-embedding many chunks
  # at once through two small models; for a chat model that ubatch size is pure VRAM cost with no
  # throughput benefit, because chat is single-conversation autoregressive decode after one
  # prefill. llama.cpp's own defaults are `-b 2048` (`--help`, `b10534`: "logical maximum batch
  # size (default: 2048)") and `-ub 512` ("physical maximum batch size (default: 512)"); `-b 2048`
  # stays explicit here (rather than inheriting 8192) so the compute/graph buffer stays small and
  # the VRAM budget is dominated by weights + KV cache, which is what the fit math below is
  # computed against. `-ub` is deliberately NOT set in this macro (2026-09-08,
  # plans/moe-offload-load-mode-and-qwen4exp-fit-math.md WP-1) so a per-entry `-ub` override
  # (`qwen36-a3b`'s `-ub 2048`) does not double-specify it — llama-server `b10534` warns
  # `DEPRECATED: argument '-ub' specified multiple times … only last value will be used`
  # (harmless, last wins, but llama-swap never surfaces the warning — see the `qwen36-a3b` entry
  # comment below); a consumer that does not override `-ub` runs at the 512 default. `-c`
  # (context) is set per model below, not in this shared macro, because the safe context size
  # differs per model (see the fit math on each entry and on the `chat` group).
  llama_server_chat_common: >
    /usr/local/bin/llama-server
    --host 0.0.0.0 --port ${PORT}
    -ngl 99 -b 2048

models:
  bge-m3-f16:
    name: "BGE-M3 embedding (f16)"
    aliases:
      - bge-m3
    # Capability metadata contract: docs/model-capabilities.md (field names/semantics normative
    # there; llama-swap surfaces this block verbatim under `meta.llamaswap` in /v1/models).
    metadata:
      context_length: 8192
      input_modalities: ["text"]
      output_modalities: ["embedding"]
      tool_calling: false
      reasoning: "none"
      serving:
        quant: "F16"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: false
    cmd: |
      ${llama_server_common}
      -m /models/CompendiumLabs/bge-m3-gguf/bge-m3-f16.gguf
      --embeddings
    ttl: 1800
    checkEndpoint: /health

  bge-reranker-v2-m3-Q8_0:
    name: "BGE reranker v2 m3 (Q8_0)"
    aliases:
      - bge-reranker-v2
    metadata:
      context_length: 8192
      input_modalities: ["text"]
      output_modalities: ["score"]
      tool_calling: false
      reasoning: "none"
      serving:
        quant: "Q8_0"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: false
    cmd: |
      ${llama_server_common}
      -m /models/gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf
      --reranking
    ttl: 1800
    checkEndpoint: /health

  # Appended 2026-07-26 for news-ingestion (WP-3 of plans/inference-engine-launch.md): the
  # embedding half of its enrichment pipeline, today an in-process sentence-transformers
  # `BAAI/bge-small-en-v1.5`. 384 dimensions, English, and small enough (67 MB at f16) that
  # quantising it would trade measurable retrieval quality for nothing that matters — hence f16
  # rather than the Q8_0 used for the reranker, whose weights are 30x larger.
  # The GGUF is CompendiumLabs' conversion, the same publisher as bge-m3 above, so the /models
  # layout stays consistent: /models/<publisher>/<repo>/<file>.
  # `--embeddings` and no `--pooling`, for the reason in the macro comment above: the GGUF
  # metadata already carries this model's CLS pooling and `--embeddings` implies it.
  bge-small-en-v1.5-f16:
    name: "BGE small en v1.5 embedding (f16, 384d)"
    aliases:
      - bge-small
    metadata:
      context_length: 8192
      input_modalities: ["text"]
      output_modalities: ["embedding"]
      tool_calling: false
      reasoning: "none"
      serving:
        quant: "F16"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: false
    cmd: |
      ${llama_server_common}
      -m /models/CompendiumLabs/bge-small-en-v1.5-gguf/bge-small-en-v1.5-f16.gguf
      --embeddings
    ttl: 1800
    checkEndpoint: /health

  # ── Chat models — see the VRAM fit math in the `chat` group comment below before adding a
  # third entry. `--jinja` makes llama-server render each model's own embedded Jinja chat
  # template (GGUF `tokenizer.chat_template`, present on both files below) via minja instead of
  # a hardcoded built-in template — required for gemma4's reasoning-style template, which is
  # also why a chat completion needs `max_tokens >= 128`: the model spends its early completion
  # tokens on `reasoning_content` before it emits `content` (see smoke-inference.sh).
  # `--mmproj` (added 2026-07-27, obsidian-crucible plans/image-descriptions-search.md) loads the
  # multimodal projector beside the weights, enabling vision (image content parts on
  # /v1/chat/completions) on the same alias — no new alias, no consumer change. The BF16 mmproj
  # is 167 MiB of extra VRAM, noise against the fit math below. Vision requests from Crucible
  # carry `reasoning_effort: "none"`, a correctness requirement: without it the model spends the
  # completion budget on reasoning_content and returns empty `content`.
  # gemma-4-12B-it-Q4_K_M (alias `gemma-4-12b`) was removed here 2026-08-25 — see the tombstone
  # in the consumer-registry header above. `gemma-4-12b-qat` below is the replacement.
  nemotron-3-nano-4B-UD-Q4_K_XL:
    name: "NVIDIA Nemotron 3 Nano 4B (UD-Q4_K_XL)"
    aliases:
      - nemotron-4b
    metadata:
      context_length: 131072
      input_modalities: ["text"]
      output_modalities: ["text"]
      tool_calling: true
      reasoning: "request-controllable"
      serving:
        quant: "UD-Q4_K_XL"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: false
      # Card states two temperatures -- 1.0 for reasoning tasks (used here; nemotron-4b serves
      # general chat/reasoning traffic on this fleet) and 0.6 for tool calling. The tool-calling
      # value is not modeled as a metadata key (this consumer default targets reasoning tasks) --
      # recorded here so the card fact isn't lost; source below carries both.
      sampling:
        temperature: 1.0
        top_p: 0.95
      max_output:
        reasoning_budget: -1
