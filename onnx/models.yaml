# inference-engine-onnx — model registry for the GLiNER2-family CPU sidecar.
#
# This file is bind-mounted read-only at /app/models.yaml by the compose service — it is NEVER
# baked into the image (the Dockerfile does not COPY it), so a model can be added without a
# rebuild. Registry edits apply on container restart, not on save. Same convention as
# llama/config.yaml next door, for the same reason.
#
# ── Aliases are the API surface — APPEND ONLY, never rename or delete ──────────────────────────
#
# An alias rename does not error anywhere; it silently forks consumer state. Treat this list the
# way a public API's field names are treated. Add new aliases freely; never repurpose one.
#
# ── Consumer registry — who stores which alias, and where ──────────────────────────────────────
#
#   alias             consumer            stored where
#   gliner2-base      news-ingestion      Postgres `PRIMARY KEY (event_id, model)` in the
#                                         crisis24_enrich schema. NOTE the wire alias and the
#                                         stored id DIFFER on purpose: the wire alias is
#                                         `gliner2-base`, the stored id stays
#                                         `gliner2-base-v1` (enrich's `model_id` property —
#                                         `_short_id` drops the HF org prefix from
#                                         `fastino/gliner2-base-v1`), because 19k rows already
#                                         carry it. Changing either one forks the store.
#   gliner2-base      eval-harness/transcript_enrichment
#                                         SQLite `runs.model` column (the tool's `APP_DB_PATH`
#                                         DB), as the FULL persisted id `fastino/gliner2-base-v1`
#                                         -- never in vault note frontmatter (`notes.py:48-69`
#                                         writes the `entities:` mapping only). NOTE this
#                                         deliberately differs from news-ingestion's
#                                         `_short_id`-trimmed `gliner2-base-v1` above: the two
#                                         consumers persist different strings for the same alias
#                                         on purpose.
#   gliner2-pii       (prospective)       eval-harness / news-ingestion PII sprints — append the
#                                         row here when the first consumer lands.
#   hsc-turn-state    fleet-tools     `scripts/wait-classifier-hook.mjs` (POST /v1/classify);
#                                         the alias is stored as the outbox `turn.classified`
#                                         event's `classifier` field.
#
# ── Runtime types ─────────────────────────────────────────────────────────────────────────────
#
# `type: gliner2` (the default when omitted) is served by POST /v1/extract; `type: seqcls` is an
# `hsc-seqcls/1` sequence-classifier bundle (model.onnx + tokenizer.json + manifest.json) served
# by POST /v1/classify. Either route answers a model of the other type with a 400.
#
# ── Adding a family member is a config append plus a weights fetch. No code. ───────────────────
#
# Every member of `fastino/gliner2-family` is the same architecture (DebertaV2 encoder + span
# head + count head), which is exactly what makes that true — one runtime serves all of them.
# The steps:
#
#   1. Export the checkpoint on a host with torch (NOT in this image — it has no torch):
#        python onnx/tools/export_gliner2.py \
#          --model fastino/<repo> --out /models/fastino/<repo>-onnx
#      The exporter's parity gate compares its own ONNX output against the torch library and
#      exits non-zero if they disagree. Do not ship an export that skipped it (`--no-verify`).
#   2. Append a block below. `path` is the container-side path under the read-only /models mount.
#   3. Restart the container (configs are mounted, not baked) and run onnx/smoke-extract.sh.
#
# ── Residency ─────────────────────────────────────────────────────────────────────────────────
#
# Hot models are `preload: true` (the default): loaded before the listener opens, resident, never
# unloaded — no request to them ever eats a cold load. Rare models are `preload: false` plus
# `idle_unload_seconds: N`: loaded on first request (cold load ~2-3.5 s, accepted for them) and
# dropped after N s with no request in flight (gc + malloc_trim returns the RAM to the OS).
# `idle_unload_seconds` on a preloaded model is a config error. Readiness (`/health` ok) means
# every preload model is resident. compose `mem_limit` stays sized for every model loaded at once.
# The compose healthcheck's start_period must cover the sum of the preloaded models' loads.

models:
  gliner2-base:
    name: "GLiNER2 base v1 (English, DeBERTa-v3-base)"
    source_model: fastino/gliner2-base-v1
    path: /models/fastino/gliner2-base-v1-onnx
    preload: false
    idle_unload_seconds: 900
    notes: >-
      Launch consumer: news-ingestion `enrich` (entity extraction + severity/event_type
      zero-shot classification over crisis24 rows). Counting layer count_lstm_v2.

  gliner2-pii:
    name: "GLiNER2 privacy filter, PII multilingual (mDeBERTa-v3-base)"
    source_model: fastino/gliner2-privacy-filter-PII-multi
    path: /models/fastino/gliner2-privacy-filter-PII-multi-onnx
    preload: false
    idle_unload_seconds: 900
    notes: >-
      Multilingual PII entity extraction. Different encoder (mdeberta, 250k vocab) and a
      different counting layer (count_lstm) from gliner2-base — configured at launch precisely
      because serving both proves the registry generalises across the family, not just across
      one checkpoint's twins.

  hsc-turn-state:
    type: seqcls
    name: "hsc turn-state classifier (mmbert-small run 5, v5 labels)"
    source_model: eval-harness/hook_state_classifier run-5 mmbert-small
    path: /models/local/hsc-mmbert-small-run5-onnx
    preload: true
