  #   (solid-red PNG, reasoning_effort "none" → "Red", body-verified).
  # - 262144 (256k test point): VALID AND FITS — the plan's expected f16 fit-fail did NOT
  #   materialize (the ≈8 GiB KV extrapolation was pessimistic; SWA-aware allocation is
  #   lighter). Recall exact at a real 234,066-token prompt (89.3%), MTP acceptance 0.79,
  #   prefill 576 t/s (6.8 min), peak 15.09 GB used → 1.87 GiB free — passes the ~1.5 GiB gate
