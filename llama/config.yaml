  # after cold load + chat probe: 10,450,456,576 B / 9.73 GiB → footprint ≈8.97 GiB
  # (weights 6.26 + mmproj 0.16 + MTP sidecar & draft context + KV + buffers); after vision
  # probe: 10,458,386,432 B (stable — buffers pre-allocated). Free ≈6.2 GiB, well over the
  # ~1.5 GiB gate, no -c step-down needed. Chat probe body-verified MTP engaged: draft_n=36,
