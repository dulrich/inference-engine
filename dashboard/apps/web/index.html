<!doctype html>
<!-- No data-accent: orange, the signalworks default for status-heavy dashboards (CC-10).
     Was green to avoid colliding with model_scoreboard's orange; the user dropped that
     constraint 2026-08-24 ("green feels out of place" beside the fleet's status tools). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bench Dashboard</title>
    <!-- Favicon = the AppHeader's lucide `Activity` mark (App.svelte), inline data-URI on the
         fleet convention (fleet-tools/references/visual-language.md "Favicon"): tab, header
         and Command Center card show one identical glyph. Stroke is the accent (#ff8a3d). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff8a3d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2'/%3E%3C/svg%3E"
    />
    <script>
      /* signalworks:boot v1 */
      // No-flash surround resolution: stored choice -> OS preference -> Med (CC-03).
      // Inline this script in <head> BEFORE any stylesheet so first paint already has
      // data-surround set.
      (function () {
        var KEY = "bench-dashboard.surround.v1";
        var LEGACY_KEYS = [];
        var s = null;
        try {
          s = localStorage.getItem(KEY);
          for (var i = 0; s === null && i < LEGACY_KEYS.length; i++) {
            s = localStorage.getItem(LEGACY_KEYS[i]);
          }
        } catch (e) {
          /* storage unavailable: fall through to OS preference */
        }
        if (s !== "dark" && s !== "med" && s !== "light") {
          s = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "med";
        }
        document.documentElement.dataset.surround = s;
      })();
      /* signalworks:boot end */
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
