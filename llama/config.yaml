  # record above. Free ≈5.2 GiB, well over the ~1.5 GiB gate, no -c step-down needed. MTP
  # body-verified engaged both probes: draft acceptance 0.85/0.83, tg 54.3/54.6 tok/s (vs
  # ≈29-30 tok/s pre-MTP at the same -ncmoe 32 placement — the batched-verification
  # amortization of CPU-expert streaming, even better at short generations than the spike's
  # +64% figure at -c 8192).
  #
  # ── Long-context landing (host-verified 2026-08-25, plans/long-context-serving-default.md
  # WP-2) ── `-c` 100000 → 131072 (serving default) + per-model `-ub 2048` override (last flag
  # wins over the macro's `-ub 512`). All numbers below live-measured on this host:
  # - 131072 landing: footprint 12.38 GB used vs 0.89 GB baseline (≈11.5 GB), 4.4 GiB free at
  #   peak (VRAM flat load→post-probe: KV + draft context + compute buffer pre-allocated).
  #   Needle-at-depth recall exact at a real 118,026-token prompt (90% fill), draft acceptance
  #   0.85-0.87, tg ≈46-55 t/s unchanged by -ub.
  # - `-ub 2048` (user-directed experiment, plan rev 2): prefill 321.5 → 745.4 t/s at 6.5k
  #   (2.32x) and 270.6 → 600.0 t/s at 118k (2.22x; 7.3 → 3.3 min wall), for +1.0 GB compute
  #   buffer (12.38 → 13.38 GB used, 3.46 GiB free — gate holds). Mechanism confirmed: with
  #   -ncmoe 32, prefill streams CPU-resident expert weights over PCIe once per micro-batch;
  #   a 4x micro-batch amortizes each transfer across 4x tokens. Decode untouched (token-at-a-
  #   time). Dense/GPU-resident models have no streaming to amortize — override is qwen36-only.
  # - 262144 (256k test point): functionally VALID — recall exact at a real 234,971-token
  #   prompt (89.6%), MTP engaged (acceptance 0.87), no collapse — but fit-FAILS the ~1.5 GiB
