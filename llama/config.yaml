# other MoE-offload entry is its nearest neighbour in footprint and placement behaviour, not
# the 12B it shares a family with.
#
# ── VRAM fit math (live read-backs from the two ladder windows, headless profile;
# docs/test-matrix-results.md "## gemma4-26b-a4b-ladder-v1" / "## gemma4-26b-a4b-ladder-v2") ──
# at this model's real `-c 131072`, `-ncmoe 18`, f16 KV, `--mmproj` and the MTP
# draft both resident: 13.59 GiB loaded (both ladders, ±0.01 GiB) over a 0.59-0.77 GiB quiesced
