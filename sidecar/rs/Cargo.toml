[package]
name = "codex-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Anthropic-Messages front end over codex app-server, one child per persona (plans/codex-sidecar-rust-port.md)."

[lib]
name = "codex_sidecar"
path = "src/lib.rs"

[[bin]]
name = "codex-sidecar"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
