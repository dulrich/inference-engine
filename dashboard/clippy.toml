# Fleet clippy policy, vendored by fleetkit/install.sh to each consumer workspace root.
disallowed-methods = [
    { path = "u8::from_str_radix", reason = "validate digits first: use fleetkit::radix::parse_radix (X1: from_str_radix accepts a leading +)" },
    { path = "u16::from_str_radix", reason = "validate digits first: use fleetkit::radix::parse_radix (X1: from_str_radix accepts a leading +)" },
    { path = "u32::from_str_radix", reason = "validate digits first: use fleetkit::radix::parse_radix (X1: from_str_radix accepts a leading +)" },
    { path = "u64::from_str_radix", reason = "validate digits first: use fleetkit::radix::parse_radix (X1: from_str_radix accepts a leading +)" },
    { path = "usize::from_str_radix", reason = "validate digits first: use fleetkit::radix::parse_radix (X1: from_str_radix accepts a leading +)" },
    { path = "i32::from_str_radix", reason = "validate digits first: use fleetkit::radix::parse_radix (X1: from_str_radix accepts a leading +)" },
    { path = "i64::from_str_radix", reason = "validate digits first: use fleetkit::radix::parse_radix (X1: from_str_radix accepts a leading +)" },
]
