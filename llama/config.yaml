#
# The solo set follows directly from that 13.59 GiB: it does not fit beside the ≈1.5 GiB
# retrieval models on this 16 GiB card with a desktop attached, so a request for this alias
# evicts whatever else is resident first, and a retrieval request afterwards evicts it. `ttl:
# 1800` returns both the VRAM and the pinned host-side expert
# buffer that `--load-mode none` allocates (an anonymous `Vulkan_Host` buffer rather than
# evictable page cache, on a 62 GB host — the same RAM consequence `qwen36-a3b` carries) after
