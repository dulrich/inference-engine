# at face value (this is exactly the shape config C's real failure took): all four are the
# benign reasoning-budget-truncation pattern (genuine correct recall, verbose self-verification
# exceeding the needle-probe's 256-token budget), never config C's degenerate haystack
# regurgitation. Full investigation and per-trace evidence in the results doc.
# UD-Q5_K_XL / UD-Q6_K_XL removed 2026-08-25 (user-directed hold on Q4 only — see the
# registry comment); their WP-4 step-5 placement records (`-ncmoe 34`/`-ncmoe 35`) live in
