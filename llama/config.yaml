  # ── Gemma 4 26B A4B QAT + MTP (unsloth/gemma-4-26B-A4B-it-qat-GGUF), no external consumer yet
  # — see plans/gemma4-26b-a4b-qat-mtp-ladder.md. A NEW alias, deliberately not a repoint of
  # `gemma-4-12b-qat` above (append-only contract). Sparse-MoE sibling of the served 12B: same
  # QAT recipe family, same vendor-published drafter (`mtp-gemma-4-26B-A4B-it.gguf`, a sidecar,
  # `--spec-type draft-mtp`) and mmproj (vision) from the same repo, plus `-ncmoe` expert offload
  # to host RAM — which is what makes a 26B fit this card at all.
  # ── Served rung = 128k (user decision 2026-09-13), picked from the measured 4-rung ladder:
  # docs/test-matrix-results.md "## gemma4-26b-a4b-ladder-v1" (thinking-mode timing/VRAM
  # reference) and "## gemma4-26b-a4b-ladder-v2" (the recall measurement — v1's needle verdicts
  # measure Gemma 4's default thinking budget against the battery's response cap, NOT recall).
  # At this entry's real `-c 131072` with `-ncmoe 18`: live loaded 13.59 GiB (v1 and v2 agree to
  # ±0.01 GiB) over a 0.6 GiB quiesced baseline, against the ≈14.8 GiB headless live budget;
  # prefill ≈1.46k t/s; decode 51 t/s with a 125k-token KV attached, against 35 t/s on the
  # no-MTP base-decode control arm — MTP buys 1.45× here (v1 measured 1.46×, mode-independent).
  # No-think needle recall at 128k is 22-26/27 (MTP arm 22, base arm 26, QAT-Q4_0 25 — one band
  # at n=1 trials, not a quant or spec-decode ranking), with `single_needle` 9/9 at every depth;
  # 32k and 64k are 27/27.
  # Step-down fallback, already measured, if this rung ever proves unsafe: `-c 65536` at
  # `-ncmoe 14` — 13.48 GiB live, 66 t/s, 27/27. Step-up is available but not free: 262144 at
  # `-ncmoe 24` is a working rung — 13.56 GiB, 23/27, 38 t/s. Note the fit math UNDER-predicts
  # the live footprint by ~1.0-1.2 GiB on this entry (compute buffers at `-ub 2048`); the
  # figures above are live read-backs, not predictions.
  # ── Consumer caveat, carried verbatim from `gemma-4-12b-qat` (same family, same template) ──
  # a chat completion needs `max_tokens >= 128`, because the model spends its early completion
  # tokens on `reasoning_content` before it emits `content`; vision and short-answer callers send
  # `reasoning_effort: "none"`, a correctness requirement — without it the model spends the
  # completion budget on reasoning_content and returns empty `content`. This entry keeps the
  # template's DEFAULT reasoning, request-controllable exactly as `gemma-4-12b-qat` is:
  # `--reasoning off` was the ladder-v2 measurement setting, never a serving decision.
  # `--load-mode none` per docs/moe-offload-serving-recipe.md (this is the second production
  # entry with CPU-resident expert tensors); `-ub 2048`, `-ctk/-ctv f16` and `-fa auto` are the
  # measured ladder cell's own values, carried over unchanged so the served config is the one
  # that was measured.
