    name: "Gemma 4 26B A4B it QAT (UD-Q4_K_XL)"
    aliases:
      - gemma-4-26b-a4b
    metadata:
      context_length: 131072
      input_modalities: ["text", "image"]
      output_modalities: ["text"]
      # Both live-verified at landing (2026-09-13, router :4811, by body): default request ->
      # `reasoning_content` present; `reasoning_effort: "none"` -> clean `content`, no reasoning
      # field; a `tools` request with `reasoning_effort: "none"` -> `finish_reason: tool_calls`
      # with a well-formed `get_weather` call. Caveat stronger than the 12B's: the default request
      # with `max_tokens: 256` spent ALL 256 tokens in `reasoning_content` and returned empty
      # `content` -- short-answer callers send `reasoning_effort: "none"` or a much larger cap.
      tool_calling: true
      reasoning: "request-controllable"
      serving:
        quant: "UD-Q4_K_XL"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: true
        moe_cpu_offload_layers: 18
        ubatch: 2048
      # Advisory provenance (docs/model-capabilities.md): re-verified 2026-09-14 against this
      # model's OWN card (google/gemma-4-26B-A4B-it) during the recipe audit
      # (plans/bench-dashboard-serving-control.md WP-2) — the values are unchanged from the
      # gemma4 family set carried from `gemma-4-12b-qat`, but they are no longer carried: the
      # 26B-A4B card states the same standardized sampling configuration itself.
      sampling:
        temperature: 1.0
        top_p: 0.95
        top_k: 64
      max_output:
        reasoning_budget: -1
        answer_tokens: 32000
      sources:
        "sampling.temperature": {url: "https://huggingface.co/google/gemma-4-26B-A4B-it", verified: "2026-09-14"}
        "sampling.top_p": {url: "https://huggingface.co/google/gemma-4-26B-A4B-it", verified: "2026-09-14"}
        "sampling.top_k": {url: "https://huggingface.co/google/gemma-4-26B-A4B-it", verified: "2026-09-14"}
        "sampling.min_p": {url: "none", reason: "the card's Best Practices state only temperature/top_p/top_k; the unsloth gemma-4-26B-A4B-it-qat GGUF card, the unsloth Gemma 4 guide and the vLLM Gemma 4 recipe all state none"}
        "sampling.presence_penalty": {url: "none", reason: "the card's Best Practices state only temperature/top_p/top_k; the unsloth gemma-4-26B-A4B-it-qat GGUF card, the unsloth Gemma 4 guide and the vLLM Gemma 4 recipe all state none"}
        "sampling.repetition_penalty": {url: "none", reason: "the card's Best Practices state only temperature/top_p/top_k; the unsloth gemma-4-26B-A4B-it-qat GGUF card, the unsloth Gemma 4 guide and the vLLM Gemma 4 recipe all state none"}
        "max_output.answer_tokens": {url: "none", reason: "no approved source states a recommended answer cap for this family; 32000 is the Claude Code default max_tokens ceiling alone (CLAUDE_CODE_MAX_OUTPUT_TOKENS, docs/model-capabilities.md answer_tokens rule), not a publisher value"}
    cmd: |
      ${llama_server_chat_common}
      -m /models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf
      -md /models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/mtp-gemma-4-26B-A4B-it.gguf
