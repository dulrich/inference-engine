  # `exclusive: true` already produce exactly the wanted behaviour -- selecting a different
  # effort id swaps the resident model (one reload; only one of these fits on a 15.92 GiB card
  # regardless). A second exclusive group would restate that invariant in two places without
  # changing any behaviour. Group membership is not a consumer marker here: the unsuffixed
  # `qwen38-27b-iq3s` has had a stored consumer for weeks while living in the same group, and the
  # registry header above is what records consumer status.
  #
  # Flag semantics, quoted verbatim from `llama-server --help` in this image (b10534):
  #   -rea, --reasoning [on|off|auto]   "Use reasoning/thinking in the chat ('on', 'off', or
  #                                      'auto', default: 'auto' (detect from template))"
  #   --reasoning-budget N              "token budget for thinking: -1 for unrestricted, 0 for
  #                                      immediate end, N>0 for token budget (default: -1)"
  #   --reasoning-budget-message MSG    "message injected before the end-of-thinking tag when
  #                                      reasoning budget is exhausted (default: none)"
  #
  # `--reasoning off` is used for the `-off` entry in preference to
  # `--chat-template-kwargs '{"enable_thinking":false}'`: it is the server-level,
  # template-agnostic expression of "no reasoning in this chat", which is the flag's whole
  # documented job, whereas `--chat-template-kwargs` injects a raw template variable whose NAME
  # (`enable_thinking`) is specific to the Qwen3.8 template -- if that template ever stopped
  # reading the variable the flag would go silently inert (no error, reasoning quietly back on),
  # which is the exact "guard passes and the thing is wrong" failure family this directory's
  # AGENTS.md is about. The underlying suppression is spike-verified on these very weights: probe
  # 1 sent `chat_template_kwargs:{"enable_thinking":false}` per request and got zero reasoning
  # characters back (vs 74 by default). If the go-live smoke shows `--reasoning off` NOT
  # suppressing the trace on this build, the measured fallback is that `--chat-template-kwargs`
  # form -- swap the flag, do not add a second mechanism on top.
  #
  # `-off` and `-high` are the two ends: `-off` emits no reasoning at all, `-high` is exactly
  # today's unbudgeted behaviour (`--reasoning-budget -1` is the server default, stated
  # explicitly so the entry is self-describing and its metadata is a true projection of `cmd:`).
