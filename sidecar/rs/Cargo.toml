[package]
name = "codex-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "codex-sidecar: an Anthropic-Messages front end over codex app-server, one child per codex persona."

[lib]
name = "codex_sidecar"
path = "src/lib.rs"

[[bin]]
name = "codex-sidecar"
path = "src/main.rs"

[dependencies]
fleetkit = { path = "crates/fleetkit", features = ["shutdown"] }
# Typed codex frames/usage and outbox rows (already in the graph via serde_json).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# SSE response body: a poll_fn stream over the sink's channel (the gateway already pulls it).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# kill(2)/SIGTERM, signal names, getrandom(2) (already in the graph via tokio).
libc = "0.2"
# The body-limit error type behind axum::body::to_bytes (already in the graph via axum).
http-body-util = "0.1"

[workspace]
exclude = ["crates/fleetkit"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
