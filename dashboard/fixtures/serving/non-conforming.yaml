      context_length: 131072
      input_modalities: ["text"]
      output_modalities: ["text"]
      tool_calling: true
      reasoning: "request-controllable"
      serving:
        quant: "UD-Q4_K_XL"
        kv_cache_type: "f16"
        flash_attention: false
      sampling:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
      max_output:
        reasoning_budget: -1
        answer_tokens: 32000
      sources:
        "sampling.temperature": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_p": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_k": { url: "https://docs.vllm.ai/projects/recipes/en/latest/FixtureLab/Fixture-Chat-12B.html", verified: "2026-09-13" }
        "sampling.min_p": { url: "https://huggingface.co/unsloth/Fixture-Chat-12B-GGUF", verified: "2026-09-13" }
