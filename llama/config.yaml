    m3: bge-m3-f16
    rr: bge-reranker-v2-m3-Q8_0
    sm: bge-small-en-v1.5-f16
    nemo: nemotron-3-nano-4B-UD-Q4_K_XL
    cpm32: MiniCPM5-2B-Q6_K-c32k-f16
    cpm64: MiniCPM5-2B-Q6_K-c64k-q8_0
    cpm128: MiniCPM5-2B-Q6_K-c128k-q4_0
    gqat: gemma-4-12B-it-qat-UD-Q4_K_XL
    lq4: Ling-3.0-tiny-UD-Q4_K_XL
    lq6: Ling-3.0-tiny-UD-Q6_K_XL
    lq8: Ling-3.0-tiny-Q8_0
    q36: Qwen3.6-35B-A3B-UD-Q4_K_XL
    g26: gemma-4-26B-A4B-it-qat-UD-Q4_K_XL
    q27xxs: Qwen3.8-27B-UD-IQ3_XXS
    q27s: Qwen3.8-27B-UD-IQ3_S
    q27q3: Qwen3.8-27B-UD-Q3_K_XL
    q27off: Qwen3.8-27B-UD-IQ3_S-reasoning-off
    q27low: Qwen3.8-27B-UD-IQ3_S-reasoning-low
    q27med: Qwen3.8-27B-UD-IQ3_S-reasoning-medium
    q27high: Qwen3.8-27B-UD-IQ3_S-reasoning-high
  sets:
    # nemotron-4b ≈5.5 GB (5.1 GiB, -c 131072) + retrieval ≈1.5 GiB ≈ 6.6 GiB ≤ 12.8.
    nemo_retrieval: "nemo & m3 & rr & sm"
    # gemma-4-12b-qat ≈11.5 GB (10.7 GiB, -c 131072, vision+MTP) + retrieval ≈1.5 GiB ≈ 12.2 GiB ≤ 12.8.
    gqat_retrieval: "gqat & m3 & rr & sm"
    # MiniCPM5-2B c32k f16 3270 MiB peak (3.2 GiB) + retrieval ≈1.5 GiB ≈ 4.7 GiB ≤ 12.8.
    cpm32_retrieval: "cpm32 & m3 & rr & sm"
