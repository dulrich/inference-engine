# Fixture config for `dashboard/scripts/check-serving-recipes.ts` (WP-1,
# `plans/bench-dashboard-serving-control.md`). NOT a copy of `llama/config.yaml` and never
# loaded by any service -- the entries below are hand-authored to be CONFORMING under every
# rule the gate enforces, so a regression in the gate shows up as a false positive here.
# `cmd:` lines follow the shape of the real config's chat entries (shared macro + per-entry
# `-m`/`-c`/flags); the model paths are fictional.

macros:
  llama_server_common: >
    /usr/local/bin/llama-server
    --host 0.0.0.0 --port ${PORT}
    -ngl 99 -c 8192 -b 8192 -ub 8192

  llama_server_chat_common: >
    /usr/local/bin/llama-server
    --host 0.0.0.0 --port ${PORT}
    -ngl 99 -b 2048

models:
  fixture-chat-UD-Q4_K_XL:
    name: "Fixture chat 12B (UD-Q4_K_XL)"
    aliases:
      - fixture-chat
    metadata:
      context_length: 131072
      input_modalities: ["text"]
      output_modalities: ["text"]
      tool_calling: true
      reasoning: "request-controllable"
      serving:
        quant: "UD-Q4_K_XL"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: false
      sampling:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
      max_output:
        reasoning_budget: -1
        answer_tokens: 32768
      sources:
        "sampling.temperature": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_p": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_k": { url: "https://docs.vllm.ai/projects/recipes/en/latest/FixtureLab/Fixture-Chat-12B.html", verified: "2026-09-13" }
        "sampling.min_p": { url: "https://huggingface.co/unsloth/Fixture-Chat-12B-GGUF", verified: "2026-09-13" }
        "sampling.presence_penalty": { url: "none", reason: "the card is silent on this value" }
        "sampling.repetition_penalty": { url: "none", reason: "the card is silent on this value" }
        "max_output.answer_tokens": { url: "https://docs.vllm.ai/projects/recipes/en/latest/FixtureLab/Fixture-Chat-12B.html", verified: "2026-09-13" }
    cmd: |
      ${llama_server_chat_common}
      -m /models/unsloth/Fixture-Chat-12B-GGUF/Fixture-Chat-12B-UD-Q4_K_XL.gguf
      -c 131072
      --jinja
    ttl: 1800
    checkEndpoint: /health

  fixture-vision-UD-Q4_K_XL:
    name: "Fixture vision 12B (UD-Q4_K_XL)"
    aliases:
      - fixture-vision
    metadata:
      context_length: 65536
      input_modalities: ["text", "image"]
      output_modalities: ["text"]
      tool_calling: true
      reasoning: "budgeted"
      serving:
        quant: "UD-Q4_K_XL"
        kv_cache_type: "q4_0"
        flash_attention: true
        mtp: false
        ubatch: 2048
        reasoning_budget: 8192
      sampling:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
      max_output:
        reasoning_budget: 8192
        answer_tokens: 16384
      sources:
        "sampling.temperature": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_p": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_k": { url: "https://docs.vllm.ai/projects/recipes/en/latest/FixtureLab/Fixture-Chat-12B.html", verified: "2026-09-13" }
        "sampling.min_p": { url: "https://huggingface.co/unsloth/Fixture-Chat-12B-GGUF", verified: "2026-09-13" }
        "sampling.presence_penalty": { url: "none", reason: "the card is silent on this value" }
        "sampling.repetition_penalty": { url: "none", reason: "the card is silent on this value" }
        "max_output.answer_tokens": { url: "https://docs.vllm.ai/projects/recipes/en/latest/FixtureLab/Fixture-Chat-12B.html", verified: "2026-09-13" }
    cmd: |
      ${llama_server_chat_common}
      -m /models/unsloth/Fixture-Vision-12B-GGUF/Fixture-Vision-12B-UD-Q4_K_XL.gguf
      -c 65536
      --mmproj /models/unsloth/Fixture-Vision-12B-GGUF/mmproj-BF16.gguf
      -ctk q4_0 -ctv q4_0
      -fa on
      -ub 2048
      --reasoning-budget 8192
      --jinja
    ttl: 1800
    checkEndpoint: /health

  fixture-moe-UD-IQ3_S:
    name: "Fixture MoE 30B (UD-IQ3_S)"
    aliases:
      - fixture-moe
    metadata:
      context_length: 32768
      input_modalities: ["text"]
      output_modalities: ["text"]
      tool_calling: true
      reasoning: "none"
      serving:
        quant: "UD-IQ3_S"
        kv_cache_type: "f16"
        flash_attention: true
        mtp: false
        moe_cpu_offload_layers: 12
        reasoning_mode: "off"
      sampling:
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
      max_output:
        reasoning_budget: -1
        answer_tokens: 8192
      sources:
        "sampling.temperature": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_p": { url: "https://huggingface.co/fixturelab/Fixture-Chat-12B", verified: "2026-09-13" }
        "sampling.top_k": { url: "https://docs.vllm.ai/projects/recipes/en/latest/FixtureLab/Fixture-Chat-12B.html", verified: "2026-09-13" }
        "sampling.min_p": { url: "https://huggingface.co/unsloth/Fixture-Chat-12B-GGUF", verified: "2026-09-13" }
        "sampling.presence_penalty": { url: "none", reason: "the card is silent on this value" }
        "sampling.repetition_penalty": { url: "none", reason: "the card is silent on this value" }
        "max_output.answer_tokens": { url: "https://docs.vllm.ai/projects/recipes/en/latest/FixtureLab/Fixture-Chat-12B.html", verified: "2026-09-13" }
    cmd: |
      ${llama_server_chat_common}
      -m /models/unsloth/Fixture-MoE-30B-GGUF/Fixture-MoE-30B-UD-IQ3_S.gguf
      -c 32768
      -fa on
      -ncmoe 12
      --reasoning off
      --jinja
    ttl: 1800
    checkEndpoint: /health

  fixture-embed-f16:
    name: "Fixture embedding (f16)"
    aliases:
      - fixture-embed
    metadata:
      context_length: 8192
      input_modalities: ["text"]
      output_modalities: ["embedding"]
      tool_calling: false
      reasoning: "none"
      serving:
        quant: "F16"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: false
    cmd: |
      ${llama_server_common}
      -m /models/fixture/fixture-embed-gguf/fixture-embed-f16.gguf
      --embeddings
    ttl: 1800
    checkEndpoint: /health
