[package]
name = "bench-dashboard-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "bench-dashboard server: the Bun API's Rust replacement (plans/bench-dashboard-rust-port.md WP-3..WP-5)."

[lib]
name = "bd_server"

[[bin]]
name = "inference-dashboard"
path = "src/main.rs"

[[bin]]
name = "check-recipes"
path = "src/bin/check-recipes.rs"

[dependencies]
bench-dashboard-domain = { path = "../domain" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal", "sync", "fs", "time", "io-util"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# `float_roundtrip`: JSON.parse reads the nearest f64; serde_json's fast path may be 1 ulp off.
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
# `localeCompare` ordering (plan Spike 2: root-locale ICU4X matched Bun on every real key).
icu_collator = { version = "2", default-features = false, features = ["compiled_data"] }
# `llama/config.yaml` (plan Spike 1: order-preserving, values equal to `Bun.YAML.parse`).
yaml-rust2 = { version = "0.13", default-features = false }
# `new URL(url)` in `check:recipes`' source-url rule (WHATWG parsing, same spec as Bun).
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
