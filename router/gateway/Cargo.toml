[package]
name = "inference-router"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Same-protocol Anthropic/OpenAI relay gateway for the inference-engine router (plans/router-rust-gateway.md)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "inference-router"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
fleetkit = { path = "crates/fleetkit", features = ["shutdown"] }

[dev-dependencies]
# Paused-clock tests of the telemetry progress cadence (tests/telemetry.rs); no new crate.
tokio = { version = "1", features = ["test-util"] }
# Held bind-now/listen-later socket in the connect-retry test (fleet test-ports contract pattern 4).
socket2 = "=0.6.5"

[workspace]
exclude = ["crates/fleetkit"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
