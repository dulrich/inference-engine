# amortization of CPU-expert streaming, even better at short generations than the spike's
# +64% figure at -c 8192).
#
# ── Long-context landing (host-verified 2026-08-25, plans/long-context-serving-default.md
# WP-2) ── `-c` 100000 → 131072 (serving default) + per-model `-ub 2048` override (last flag
# wins over the macro's `-ub 512`). All numbers below live-measured on this host:
# - 131072 landing: footprint 12.38 GB used vs 0.89 GB baseline (≈11.5 GB), 4.4 GiB free at
#   peak (VRAM flat load→post-probe: KV + draft context + compute buffer pre-allocated).
#   Needle-at-depth recall exact at a real 118,026-token prompt (90% fill), draft acceptance
