# inference-engine-llama — llama-swap router config for the Vulkan GPU llama.cpp image
# (crucible-llamacpp-vulkan:b10534-swap243).
#
# This file is bind-mounted read-only at /app/config.yaml by the compose service — it is NEVER
# baked into the image (the Dockerfile does not COPY it), specifically so it can be edited
# without a rebuild. The compose wiring for that mount lives in fleet-tools's
# compose.fleet.yml; this file only defines the router shape. Config edits apply on container
# restart, not on save.
#
# ── Aliases are the API surface — APPEND ONLY, never rename or delete ──────────────────────────
#
# An alias rename does not error anywhere; it silently forks consumer state. Treat this list the
# way a public API's field names are treated. Add new aliases freely; never repurpose one.
#
# ── Consumer registry — who stores which alias, and where ──────────────────────────────────────
#
#   alias             consumer            stored where
#   bge-m3            obsidian-crucible   vault data.json provider modelId (embeddings; the
#                                         index's embedding_space key `bge-m3/f16` derives
#                                         from it — a rename would orphan a 53k-chunk index)
#   bge-reranker-v2   obsidian-crucible   vault data.json provider modelId (rerank)
#   gemma-4-12b       obsidian-crucible   vault data.json provider modelId (chat, vision)
#                     seven-afterlives    --llm-model launch flag + docs/llm-disclosure.md
#                                         backend entry (optional validated backend)
#   nemotron-4b       obsidian-crucible   vault data.json provider modelId (chat)
#                     seven-afterlives    same as gemma-4-12b
#   bge-small         news-ingestion      Postgres `PRIMARY KEY (event_id, model)` in the
#                                         `crisis24_enrich` schema. The wire alias and the
#                                         stored id DIFFER on purpose: `bge-small` on the wire,
#                                         `bge-small-en-v1.5` in the PK (enrich's `model_id`
#                                         property — `_short_id` drops the HF org prefix from
#                                         `BAAI/bge-small-en-v1.5` — and it must keep returning
#                                         the in-process value: 19k rows carry it). Its embedding space is
#                                         engine-agnostic by fleet measurement (esi-fr-2026-07-25:
#                                         engine/build/precision are retrieval-irrelevant), which
#                                         is what makes serving these vectors from llama.cpp
#                                         instead of sentence-transformers safe — enrich has no
#                                         embedding-space guard of its own.
#
# The onnx tier next door keeps its own registry with the same rules and the same header:
# `onnx/models.yaml` (aliases `gliner2-base`, `gliner2-pii`).
#
# One base-URL note: consumers reach this router at http://127.0.0.1:4811 (Crucible vaults
# store http://127.0.0.1:4811/v1). The transitional 4806 host publish was retired 2026-07-27;
# :4806 survives only as the container-internal listen port.
#
# One always-on router replaces the old per-model systemd socket-activation apparatus entirely:
# llama-swap already does spawn-on-first-request plus `ttl`-based unload, so there's no separate
# idle/wake layer to maintain, and the idle cost is a few MB of resident Go process, not a
# full inference server.

healthCheckTimeout: 120  # seconds llama-swap waits for a freshly spawned child's checkEndpoint
                         # to go healthy before giving up on the request that triggered the spawn
startPort: 15800         # first ${PORT} handed to a spawned child; never published outside the
                         # container — only llama-swap's own :4806 listener is reachable.
                         # 15800, not 5800: the old value collided (cosmetically — it was
                         # container-internal) with the fleet's 57X0/5800 dev-port convention,
                         # and a new repo should not inherit that coincidence.

macros:
  # The flags below are carried over verbatim from the compose invocations this service
  # replaces (crucible-embed-gpu / crucible-rerank-gpu). `--pooling` is DELIBERATELY absent from
  # every model's cmd: the GGUF metadata already carries the correct pooling mode, and
  # `--embeddings` / `--reranking` each imply their own pooling on top of that — do not add
  # `--pooling` back in "to be explicit". `-ngl 99` offloads every layer to the GPU; the
  # `-c/-b/-ub 8192` context/batch sizing matches what was already tuned and measured for these
  # three models.
  llama_server_common: >
    /usr/local/bin/llama-server
    --host 0.0.0.0 --port ${PORT}
    -ngl 99 -c 8192 -b 8192 -ub 8192

  # Chat models get their OWN macro, deliberately not `llama_server_common` — do not "simplify"
  # by reusing it. The retrieval macro's `-b/-ub 8192` was tuned for batch-embedding many chunks
  # at once through two small models; for a chat model that ubatch size is pure VRAM cost with no
  # throughput benefit, because chat is single-conversation autoregressive decode after one
  # prefill. llama.cpp's own defaults are `-b 2048 -ub 512`; keeping the chat macro at those
  # defaults (rather than inheriting 8192) keeps the compute/graph buffer small so the VRAM
  # budget is dominated by weights + KV cache, which is what the fit math below is computed
  # against. `-c` (context) is set per model below, not in this shared macro, because the safe
  # context size differs per model (see the fit math on each entry and on the `chat` group).
  llama_server_chat_common: >
    /usr/local/bin/llama-server
    --host 0.0.0.0 --port ${PORT}
    -ngl 99 -b 2048 -ub 512

models:
  bge-m3-f16:
    name: "BGE-M3 embedding (f16)"
    aliases:
      - bge-m3
    cmd: |
      ${llama_server_common}
      -m /models/CompendiumLabs/bge-m3-gguf/bge-m3-f16.gguf
      --embeddings
    ttl: 1800
    checkEndpoint: /health

  bge-reranker-v2-m3-Q8_0:
    name: "BGE reranker v2 m3 (Q8_0)"
    aliases:
      - bge-reranker-v2
    cmd: |
      ${llama_server_common}
      -m /models/gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf
      --reranking
    ttl: 1800
    checkEndpoint: /health

  # Appended 2026-07-26 for news-ingestion (WP-3 of plans/inference-engine-launch.md): the
  # embedding half of its enrichment pipeline, today an in-process sentence-transformers
  # `BAAI/bge-small-en-v1.5`. 384 dimensions, English, and small enough (67 MB at f16) that
  # quantising it would trade measurable retrieval quality for nothing that matters — hence f16
  # rather than the Q8_0 used for the reranker, whose weights are 30x larger.
  # The GGUF is CompendiumLabs' conversion, the same publisher as bge-m3 above, so the /models
  # layout stays consistent: /models/<publisher>/<repo>/<file>.
  # `--embeddings` and no `--pooling`, for the reason in the macro comment above: the GGUF
  # metadata already carries this model's CLS pooling and `--embeddings` implies it.
  bge-small-en-v1.5-f16:
    name: "BGE small en v1.5 embedding (f16, 384d)"
    aliases:
      - bge-small
    cmd: |
      ${llama_server_common}
      -m /models/CompendiumLabs/bge-small-en-v1.5-gguf/bge-small-en-v1.5-f16.gguf
      --embeddings
    ttl: 1800
    checkEndpoint: /health

  # ── Chat models — see the VRAM fit math in the `chat` group comment below before adding a
  # third entry. `--jinja` makes llama-server render each model's own embedded Jinja chat
  # template (GGUF `tokenizer.chat_template`, present on both files below) via minja instead of
  # a hardcoded built-in template — required for gemma4's reasoning-style template, which is
  # also why a chat completion needs `max_tokens >= 128`: the model spends its early completion
  # tokens on `reasoning_content` before it emits `content` (see smoke-inference.sh).
  # `--mmproj` (added 2026-07-27, obsidian-crucible plans/image-descriptions-search.md) loads the
  # multimodal projector beside the weights, enabling vision (image content parts on
  # /v1/chat/completions) on the same alias — no new alias, no consumer change. The BF16 mmproj
  # is 167 MiB of extra VRAM, noise against the fit math below. Vision requests from Crucible
  # carry `reasoning_effort: "none"`, a correctness requirement: without it the model spends the
  # completion budget on reasoning_content and returns empty `content`.
  gemma-4-12B-it-Q4_K_M:
    name: "Gemma 4 12B it (Q4_K_M)"
    aliases:
      - gemma-4-12b
    cmd: |
      ${llama_server_chat_common}
      -m /models/lmstudio-community/gemma-4-12B-it-GGUF/gemma-4-12B-it-Q4_K_M.gguf
      --mmproj /models/lmstudio-community/gemma-4-12B-it-GGUF/mmproj-gemma-4-12B-it-BF16.gguf
      -c 32768
      --jinja
    ttl: 1800
    checkEndpoint: /health

  nemotron-3-nano-4B-Q4_K_M:
    name: "NVIDIA Nemotron 3 Nano 4B (Q4_K_M)"
    aliases:
      - nemotron-4b
    cmd: |
      ${llama_server_chat_common}
      -m /models/lmstudio-community/NVIDIA-Nemotron-3-Nano-4B-GGUF/NVIDIA-Nemotron-3-Nano-4B-Q4_K_M.gguf
      -c 32768
      --jinja
    ttl: 1800
    checkEndpoint: /health

  # ── Ling-3.0-tiny bake-off (bloomer010/Ling-3.0-tiny-GGUF), testing only, no external consumer
  # yet — see plans/ling-3-tiny-bakeoff-and-gpu-hang-watchdog.md. BailingMoE3 architecture (a
  # hybrid Kimi-Delta-Attention + Multi-head-Latent-Attention MoE, first landed upstream
  # 2026-08-17, PR #26608) — only 6 of 24 layers carry a conventional KV cache (the other 18 are
  # KDA/linear-attention layers, no conventional KV cache, no sliding_window metadata), which is
  # why the VRAM fit math for the `ling-bakeoff` group below is deferred to a live measurement
  # rather than a static extrapolation from the `chat` group's dense-model math above. `-c 8192`
  # is deliberately conservative — well under this model's 131072-token supported context and
  # below gemma-4-12b's 32768 — because that per-token KV scaling is unmeasured on this box. No
  # `--draft`/`-md`/speculative-decoding flag on any entry: upstream reports MTP-adjacent
  # Vulkan/RADV hangs for this architecture family, and the plan's canary-first risk posture
  # keeps that code path untouched pending a separate, user-approved follow-up.
  Ling-3.0-tiny-Q4_K_M:
    name: "Ling-3.0-tiny (Q4_K_M)"
    aliases:
      - ling-3-tiny-q4-m
    cmd: |
      ${llama_server_chat_common}
      -m /models/bloomer010/Ling-3.0-tiny-GGUF/Ling-3.0-tiny-Q4_K_M.gguf
      -c 8192
      --jinja
    ttl: 1800
    checkEndpoint: /health

  Ling-3.0-tiny-UD-Q4_K_XL:
    name: "Ling-3.0-tiny (UD-Q4_K_XL)"
    aliases:
      - ling-3-tiny-ud-q4-xl
    cmd: |
      ${llama_server_chat_common}
      -m /models/bloomer010/Ling-3.0-tiny-GGUF/Ling-3.0-tiny-UD-Q4_K_XL.gguf
      -c 8192
      --jinja
    ttl: 1800
    checkEndpoint: /health

groups:
  # Embedding and reranking are small enough, and used closely enough together by a single
  # search/rerank flow, that neither should evict the other: swap/exclusive both false means
  # llama-swap is free to run both children at once, and persistent: false means the ttl above
  # is still what unloads them (a persistent group would never unload regardless of ttl).
  retrieval:
    swap: false
    exclusive: false
    persistent: false
    members:
      - bge-m3-f16
      - bge-reranker-v2-m3-Q8_0
      # bge-small joins `retrieval` rather than getting its own group: at 67 MB of weights it
      # cannot meaningfully contend for VRAM with anything, and it is used by a different
      # consumer than bge-m3 — so the two must be free to be resident at once, which is exactly
      # what swap:false/exclusive:false gives. It still unloads on its own ttl.
      - bge-small-en-v1.5-f16

  # Chat models are large enough that they cannot safely coexist with each other, or necessarily
  # with the retrieval pair, under this GPU's VRAM — swap: true unloads the group's previous
  # member before starting the next one, exclusive: true additionally stops any *other* group's
  # members first (i.e. a chat request evicts bge-m3/bge-reranker-v2 while it is in flight;
  # retrieval requests afterward reload without evicting chat — verified semantics per the
  # cutover interleave test below). The eviction-and-restore cycle itself was tested at cutover
  # (2026-07-26, gemma-4-12B Q4_K_M as the chat member, RX 9070/RADV): two full evict→reload
  # cycles, embeddings byte-identical after each reload, ~1.3s retrieval reloads warm, no amdgpu
  # errors in the kernel log. That test did not yet exercise this file's actual `chat` group
  # config below (the eviction mechanics are the same; the specific model list is new) — the
  # orchestrator re-runs the live smoke test (including the new chat-completion checks in
  # smoke-inference.sh) against a real reload before this lands.
  #
  # ── VRAM fit math (host-verified 2026-07-26, no container/model touched to get these numbers) ──
  #
  # GPU VRAM: `cat /sys/class/drm/card1/device/mem_info_vram_total` = 17,095,983,104 bytes
  # = 15.92 GiB / 17.10 GB (RX 9070, matches its 16G nameplate). This is a machine with an active
  # interactive desktop session on the SAME gpu, not a headless inference box: at measurement
  # time `mem_info_vram_used` = 3,327,463,424 bytes (~3.1 GiB / 3.3 GB), and `fuser /dev/dri/*`
  # showed ghostty, firefox, LM Studio, obsidian, and nvtop all holding the render node. So real
  # free VRAM at request time is ~12.8 GiB / 13.8 GB, not the full nameplate figure — and
  # `exclusive: true` only evicts THIS router's own groups; it cannot and does not free VRAM held
  # by other GPU clients on the host. The math below uses both figures: nameplate total (an upper
  # bound assuming nothing else is using the GPU) and the measured free-now figure (the realistic
  # bound on this desktop-shared host).
  #
  # Per-model weights are exact file sizes (`stat -c %s`) on the candidate GGUFs already on disk
  # (paths below mapped at measurement time to `~/.lmstudio/models/<publisher>/<repo>/…`; the
  # GGUF-home move has since completed, and the host layout is now
  # `/srv/models/<publisher>/<repo>/…`). KV cache is computed from each GGUF's own
  # header metadata (block count, per-layer attention.head_count_kv,
  # attention.key_length/value_length, attention.sliding_window — read directly, no model
  # loaded) at f16 KV (llama.cpp's default cache type, unquantized) and is SWA-aware: gemma4
  # declares a per-layer sliding_window (1024
  # tokens) and llama.cpp allocates the reduced cache size for the majority of layers that use it,
  # not the full requested context — only the minority "global" layers (the ones with a markedly
  # smaller head_count_kv in the GGUF metadata) scale with the full context size.
  #
  # - gemma-4-12B-it-Q4_K_M (IN, cutover-tested): weights 7,381,384,864 B = 6.87 GiB / 7.38 GB.
  #   48 layers (40 local @ head_count_kv=8 capped at the 1024-token sliding window, 8 global @
  #   head_count_kv=1 scaling with context), key/value head dim 512. At the configured -c 32768,
  #   SWA-aware KV ≈ 1.12 GiB / 1.21 GB → weights+KV ≈ 8.0 GiB / 8.6 GB. Comfortably under BOTH
  #   the nameplate total and the measured ~12.8 GiB free-now, leaving ~4.8 GiB for the
  #   compute/graph buffer even on this desktop-shared host.
  # - NVIDIA-Nemotron-3-Nano-4B-Q4_K_M (IN, small/fast option): weights 2,837,072,896 B =
  #   2.64 GiB / 2.84 GB. `nemotron_h` is a hybrid Mamba/attention architecture — only 4 of its
  #   42 layers are real attention (head_count_kv=8, head dim 128); the other 38 are SSM/conv
  #   state layers whose per-token state is ~constant in sequence length, not a KV cache in the
  #   usual sense, and this arch carries no sliding_window metadata. Even treating all 4 attention
  #   layers as full-context at -c 32768, KV ≈ 0.5 GiB / 0.54 GB → weights+KV ≈ 3.14 GiB / 3.37 GB.
  #   Trivially safe under any VRAM figure in play here.
  # - gemma-4-26B-A4B-it-QAT-Q4_0 (OUT — for now): weights 14,439,362,752 B = 13.45 GiB /
  #   14.44 GB. That number ALONE already exceeds the measured ~12.8 GiB free-now on this
  #   desktop-shared host, before any KV cache or compute/graph buffer is added. Even against the
  #   full 15.92 GiB nameplate total (i.e. only if every other GPU client on the host were closed
  #   first), weights + SWA-aware KV at a modest -c 8192 land around 14.0 GiB, leaving well under
  #   2 GiB for the compute buffer — too thin a margin to add blind. Revisit if this box becomes
  #   dedicated/headless (removing the ~3.3 GB desktop baseline), or under a more aggressive quant
  #   (Q2_K/Q3) that shrinks the weights figure materially.
  # - 27B (Qwen3.6-27B-Q4_K_M, 16,547,398,784 B = 15.41 GiB/16.55 GB), 31B
  #   (gemma-4-31B-it-QAT-Q4_0, 17,651,000,768 B = 16.44 GiB/17.65 GB), 35B-A3B
  #   (Qwen3.6-35B-A3B-Q4_K_M, 21,166,757,728 B = 19.71 GiB/21.17 GB) — all OUT, per the plan's
  #   expectation, but on measured weight sizes rather than an assumed 16G ceiling: 27B's weights
  #   alone leave only 0.5 GiB against the full 15.92 GiB nameplate before any KV/compute buffer;
  #   31B's and 35B-A3B's weights alone already exceed the card's total nameplate capacity, i.e.
  #   they cannot load fully-offloaded on this GPU regardless of context size or what else is
  #   running.
  chat:
    swap: true
    exclusive: true
    persistent: false
    members:
      - gemma-4-12B-it-Q4_K_M
      - nemotron-3-nano-4B-Q4_K_M

  # ── ling-bakeoff — Ling-3.0-tiny quant bake-off, testing only, canary-first (see
  # plans/ling-3-tiny-bakeoff-and-gpu-hang-watchdog.md). Same shape as `chat` above:
  # swap:true/exclusive:true because no individual quant needs to coexist with anything else
  # during testing, and exclusive:true is also a safety property — only one
  # untrusted-on-this-host-architecture process resident at a time. No group-level `ttl` — the
  # schema has none (see `chat`'s comment above); each model entry above carries its own
  # `ttl: 1800`.
  #
  # ── VRAM fit math (host-verified 2026-08-20, live single- + multi-turn canary probes, two of
  # the four bake-off quants — the other two land in WP-3) ──
  #
  # Not extrapolated from the `chat` group's dense-model math above — deliberately measured live
  # instead, since this architecture's 6-of-24-layers-have-KV-cache shape (the other 18 are
  # KDA/linear-attention, no conventional KV cache, no sliding_window metadata) makes a static
  # extrapolation unreliable. `mem_info_vram_used` read directly before/after each load, at
  # -c 8192, after both a single-turn and a ≥3-turn (5-message) exchange per model, watched
  # against `journalctl -k -f` throughout with zero MES/wedged/reset signature.
  #
  # Baseline (nothing from this group loaded, desktop session active): 1,204,256,768 B
  # = 1.12 GiB / 1.20 GB. (Lower than the `chat` group's older 2026-07-26 desktop-baseline
  # measurement of ~3.1 GiB — a snapshot of whatever else happened to be holding the render node
  # that day, not a fixed floor; re-measure at request time rather than assuming either figure.)
  #
  # - Ling-3.0-tiny-Q4_K_M: weights 4,823,894,880 B = 4.49 GiB / 4.82 GB. Peak `mem_info_vram_used`
  #   after load + single-turn + multi-turn: 6,148,374,528 B = 5.73 GiB / 6.15 GB → weights+KV+
  #   buffer delta from baseline ≈ 4.60 GiB / 4.94 GB, i.e. only ~0.11 GiB of KV+compute-buffer
  #   overhead beyond the weights alone — small, consistent with only 6/24 layers carrying a real
  #   KV cache and the conservative `-c 8192`. Comfortably under the 15.92 GiB nameplate total.
  # - Ling-3.0-tiny-UD-Q4_K_XL: weights 5,340,611,328 B = 4.97 GiB / 5.34 GB. Peak
  #   `mem_info_vram_used` after load + single-turn + multi-turn (measured after `exclusive: true`
  #   fully evicted Q4_K_M first): 6,602,141,696 B = 6.15 GiB / 6.60 GB → weights+KV+buffer delta
  #   from baseline ≈ 5.03 GiB / 5.40 GB, ~0.05 GiB overhead beyond weights alone. Also
  #   comfortably under the nameplate total.
  #
  # UD-Q6_K_XL (7.27 GB) and Q8_0 (8.41 GB) — the remaining two bake-off quants — land in WP-3
  # with their own live measurement; both are expected to follow the same small-overhead pattern
  # but are NOT assumed to until measured (Q8_0 in particular is the largest single file in this
  # group, worth confirming rather than extrapolating).
  ling-bakeoff:
    swap: true
    exclusive: true
    persistent: false
    members:
      - Ling-3.0-tiny-Q4_K_M
      - Ling-3.0-tiny-UD-Q4_K_XL
