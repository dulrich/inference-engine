#   other two quants above; within the baseline-measurement noise band already documented in
#   this group's original VRAM-fit-math section (a few hundred MB of drift between reads on a
#   shared desktop session is ordinary here, not a real quant-dependent effect, since KV-cache
#   size is a function of context length and cache dtype, not weight quantization). No hang,
#   zero journal signature, container stayed healthy throughout. Comfortably under nameplate —
#   even the largest quant leaves several GiB of headroom at full -c 131072.
#
# Methodology note: a `mem_info_vram_used` reading taken as a "baseline" immediately before a
# load of a solo-set model can be misleading — eviction of the previous
# resident model is triggered by the *incoming* request, not proactively, so a read taken right
# before firing that request can still capture the prior model mid-teardown or fully resident,
# producing an inflated apparent baseline (hit once during WP-2's live measurement). All three
# WP-2 overhead figures above therefore use WP-1's own verified empty-group baseline
