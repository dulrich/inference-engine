#
# ── VRAM fit-finding (host-verified 2026-08-21, scratch llama-server on a throwaway port,
# journalctl -k -f watched throughout, zero hang signature any candidate) ──
#
# Card nameplate: 15.92 GiB. Canary UD-IQ3_S (12,040,883,104 B / 11.21 GiB) at the plan's own
# `-c 100000` target measured only 0.10 GiB free — investigated rather than accepted: KV cache
# growth is exactly linear (confirmed at three context points: 512 MiB @ 8192, 4096 MiB @ 65536,
# 6256 MiB @ 100000 -- 0.0625 MiB/token throughout), so the shortfall is real, not measurement
# noise. c=65536 (0.32 GiB free) and c=49152 (1.34 GiB free) were both still under this plan's
# ~1.5-2 GiB safety-margin convention; c=40960 landed at 1.85 GiB free (idle) / 1.83 GiB free
# (peak, after a real moderate needle-probe generation -- buffers pre-allocated, not growing
# further under use), correct recall confirmed. UD-IQ3_XXS (10,934,860,704 B / 10.18 GiB, the
# smallest quant) at the same c=40960: 2.76 GiB free, correct recall. UD-Q3_K_XL
# (13,146,393,504 B / 12.24 GiB, the largest quant) needed to step down to c=24576 for
# comparable headroom (1.83 GiB free), correct recall confirmed there too.
#
# A genuine confound found and fixed mid-WP: an early RAM-cgroup reading during the c=100000
# test showed memory.current within 0.53 GiB of the 36 GiB cap with memory.events "max"
# incrementing (real reclaim pressure) -- traced to ACCUMULATED PAGE CACHE from this session's
# earlier WP-4 model loads (~80 GiB of GGUF reads across Q4/Q5/Q6-A3B), not this model's own
# footprint: `POST /api/models/unload` (a genuine llama-swap unload-ALL-resident-models
# endpoint, more reliable than the solo-set eviction trick for establishing a true empty
# baseline) cleared VRAM but NOT the stale page cache, since cgroup v2 charges page cache to
# whichever cgroup instance first read it and does not proactively evict on process exit; a full
# `docker compose up -d --force-recreate` (the same mechanism WP-0 used for HostConfig changes)
# was needed to get a genuinely fresh cgroup, after which RAM was never actually a binding
# constraint for this model (26+ GiB margin throughout, zero memory.max events) -- VRAM was the
# real, reproducible constraint all along. Full results (timing, needle/quality-corpus detail):
# docs/qwen38-27b-bakeoff-results.md.
#
