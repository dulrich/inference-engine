# Fixture llama-swap config for `GET /api/serving` tests — deliberately small, structurally
# matching the real `llama/config.yaml` (macros + models, same key names) but never read from
# there (brief hard constraint: tests never depend on the real file being mounted).

healthCheckTimeout: 120
startPort: 15800

macros:
  llama_server_common: >
    /usr/local/bin/llama-server
    --host 0.0.0.0 --port ${PORT}
    -ngl 99 -c 8192 -b 8192 -ub 8192

models:
  # `metadata:` (WP-2, `docs/model-capabilities.md`) -- no optional `serving.*` keys, so
  # `readServingConfig` must resolve `moeCpuOffloadLayers`/`ubatch` to `null` (macro
  # default), never a guessed 0.
  fixture-embed-f16:
    name: "Fixture embedding (f16)"
    aliases:
      - fixture-embed
    metadata:
      context_length: 8192
      input_modalities: ["text"]
      output_modalities: ["embedding"]
      tool_calling: false
      reasoning: "none"
      serving:
        quant: "F16"
        kv_cache_type: "f16"
        flash_attention: false
        mtp: false
    cmd: |
      ${llama_server_common}
      -m /models/example-org/fixture-embed-gguf/fixture-embed-f16.gguf
      --embeddings
    ttl: 1800
    checkEndpoint: /health

  # `metadata:` with BOTH optional `serving.*` keys present -- the full-block case.
  fixture-chat-q4:
    name: "Fixture chat model (Q4_K_M)"
    aliases:
      - fixture-chat
    metadata:
      context_length: 32768
      input_modalities: ["text"]
      output_modalities: ["text"]
      tool_calling: true
      reasoning: "request-controllable"
      serving:
        quant: "Q4_K_M"
        kv_cache_type: "q4_0"
        flash_attention: true
        mtp: false
        moe_cpu_offload_layers: 8
        ubatch: 2048
    cmd: |
      /usr/local/bin/llama-server
      --host 0.0.0.0 --port ${PORT}
      -m /models/example-org/fixture-chat-gguf/fixture-chat-Q4_K_M.gguf
      -c 32768
      -ctk q4_0
      -ctv q4_0
      -fa on
      -ngl 99
    ttl: 1800
    checkEndpoint: /health

  # `allFlags` (WP-1) edge cases: a boolean flag immediately followed by another flag
  # (`--jinja`), and flag values that must NOT be mistaken for flags themselves -- a
  # negative integer (`-1`) and a decimal (`0.8`), per `FLAG_TOKEN`'s "dash(es) then a
  # letter" test in `llamaConfig.ts`. Deliberately carries NO `metadata:` block too -- the
  # WP-2 "a model with no capability metadata resolves to `capability: null`" case.
  fixture-flags-edge:
    name: "Fixture edge-case flags"
    aliases:
      - fixture-flags-edge
    cmd: |
      /usr/local/bin/llama-server
      --host 0.0.0.0 --port ${PORT}
      -m /models/example-org/fixture-edge-gguf/fixture-edge.gguf
      --jinja
      --temp 0.8
      --top-p -1
      -ngl 99
    ttl: 1800
    checkEndpoint: /health

  # No `aliases:` -- must be FILTERED OUT of `GET /api/serving`'s response (not reachable
  # by any consumer, so not a "served alias").
  fixture-unaliased:
    name: "Fixture model with no alias"
    cmd: |
      /usr/local/bin/llama-server --host 0.0.0.0 --port ${PORT}
    ttl: 1800
    checkEndpoint: /health
