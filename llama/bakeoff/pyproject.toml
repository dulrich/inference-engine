# Dev-only quality contract for the bake-off harness.
#
# The harness RUNTIME is Python-stdlib-only and stays that way: nothing here is a runtime
# dependency, nothing here enters a serving container, and `batch.py` / `sweep.py` /
# `longcontext.py` / `control_dispatcher.py` are invoked with the host's bare `python3`
# (3.12.3), never through this project's venv. This file exists solely so `uv run ruff`
# and `uv run pyright` have a pinned, reproducible configuration.

[project]
name = "inference-engine-bakeoff"
version = "0"
description = "Dev-gate configuration for the llama.cpp bake-off harness (not a distributable package)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "ruff==0.16.5",
]

[tool.uv]
# The harness targets the host interpreter; keep the gate venv on the same minor version
# so Ruff and Pyright judge the code against what actually runs it.
python-preference = "only-system"

[tool.ruff]
target-version = "py312"
line-length = 100
# Flat module layout: every production module and every test imports its siblings as
# top-level names off `sys.path`, so this directory IS the source root.
src = ["."]
extend-exclude = ["corpus", "examples", "queues", "records"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "BLE", "SIM", "RUF"]
# Two kinds of entry -- neither is a silenced finding.
#   * PERMANENT: the rule is wrong for this codebase; the reason is recorded and the line stays.
#   * PER-SITE, ONLY WHEN TOUCHED: each site needs its own behaviour judgement; fix a site when
#     the surrounding code is next changed for its own reasons. These families are COUNT-RATCHETED
#     in gates.sh (the only place their numbers live): a new finding fails the gate.
# Never add a line to make a new finding go away.
ignore = [
    "E501",    # PERMANENT. line-too-long. Prose/data lines in docstrings and tables; the repo's
               # markdown contract is explicitly "never hard-wrap", and no formatter is
               # prescribed here, so a column limit would be churn with no defect value.
    "SIM905",  # PERMANENT. split-static-string. Its site is a readable word list written as
               # `"the a an of ...".split()`; expanding it to quoted strings is strictly
               # worse to read and to extend.
    "RUF022",  # PERMANENT. unsorted `__all__` in control_dispatcher.py. Its ordering is SEMANTIC --
               # the list is grouped under `# protocol` / `# store` / `# phases` comments that
               # mirror the WP-R4 split. Alphabetizing it silently leaves those comments
               # attached to the wrong symbols. Keep the grouping; keep this off.
    "B905",    # PER-SITE, ONLY WHEN TOUCHED. zip-without-explicit-strict. Adding `strict=` is a
               # REAL behaviour change (raises on length mismatch); each site needs its own
               # judgement about whether a mismatch is a bug or tolerated.
    "SIM102",  # PER-SITE, ONLY WHEN TOUCHED. collapsible-if. Sites carry an explanatory comment
               # on the inner `if`.
    "SIM105",  # PER-SITE, ONLY WHEN TOUCHED. try/except/pass -> contextlib.suppress. Rewrites
               # exception handling in the control plane whose exception semantics WP-R4 locked.
    "SIM117",  # PER-SITE, ONLY WHEN TOUCHED. nested `with`. Cosmetic; test-only.
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["."]
exclude = ["**/__pycache__", "corpus", "examples", "queues", "records", ".venv", "tests"]
extraPaths = ["."]
